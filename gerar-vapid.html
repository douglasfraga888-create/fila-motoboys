<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gerar Chaves VAPID</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  padding: 20px;
}

.card {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
}

button {
  width: 100%;
  padding: 15px;
  background: #15803d;
  color: white;
  border: 0;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
}

textarea {
  width: 100%;
  min-height: 120px;
  margin-top: 10px;
  padding: 10px;
  font-size: 13px;
}

h3 {
  margin-bottom: 5px;
}

.aviso {
  background: #fef3c7;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 20px;
}

</style>

</head>

<body>

<div class="card">

  <h2>
    🔐 Gerador VAPID
  </h2>

  <div class="aviso">
    Guarde a chave privada em local seguro.
    Ela não deverá ficar no index.html.
  </div>

  <button onclick="gerarChaves()">
    GERAR CHAVES
  </button>

  <h3>
    Chave Pública
  </h3>

  <textarea
    id="publica"
    readonly
  ></textarea>

  <h3>
    Chave Privada
  </h3>

  <textarea
    id="privada"
    readonly
  ></textarea>

</div>


<script>

function base64Url(
  bytes
) {

  let texto =
    "";

  bytes.forEach(
    byte => {

      texto +=
        String.fromCharCode(
          byte
        );

    }
  );


  return btoa(
    texto
  )
  .replace(
    /\+/g,
    "-"
  )
  .replace(
    /\//g,
    "_"
  )
  .replace(
    /=+$/,
    ""
  );

}


async function gerarChaves() {

  try {

    const par =
      await crypto.subtle
        .generateKey(
          {

            name:
              "ECDSA",

            namedCurve:
              "P-256"

          },

          true,

          [
            "sign",
            "verify"
          ]
        );


    /*
      PUBLIC KEY

      Formato raw:
      65 bytes
      usado pelo Web Push.
    */

    const publicaRaw =
      new Uint8Array(

        await crypto.subtle
          .exportKey(
            "raw",
            par.publicKey
          )

      );


    const chavePublica =
      base64Url(
        publicaRaw
      );


    /*
      PRIVATE KEY

      Exportamos em JWK para pegar
      o campo "d", que corresponde
      à chave privada.
    */

    const privadaJwk =
      await crypto.subtle
        .exportKey(
          "jwk",
          par.privateKey
        );


    const chavePrivada =
      privadaJwk.d;


    document
      .getElementById(
        "publica"
      )
      .value =
      chavePublica;


    document
      .getElementById(
        "privada"
      )
      .value =
      chavePrivada;


    alert(
      "✅ Chaves geradas!"
    );


  } catch (erro) {

    console.error(
      erro
    );


    alert(
      "Erro ao gerar as chaves: " +
      erro.message
    );

  }

}

</script>

</body>

</html>
