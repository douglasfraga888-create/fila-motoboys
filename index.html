<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Entrada de Motoboy - Pizzaria Di Roma</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.card {
  width: 100%;
  background: white;
  padding: 30px 22px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.10);
  text-align: center;
  margin-bottom: 20px;
}

.icone {
  font-size: 55px;
  margin-bottom: 10px;
}

h1 {
  margin: 0 0 10px;
  font-size: 27px;
  color: #111827;
}

h2 {
  margin: 0;
  font-size: 22px;
  color: #111827;
}

.subtitulo {
  color: #6b7280;
  margin-bottom: 25px;
  line-height: 1.4;
}

.campo-grupo {
  text-align: left;
  margin-bottom: 15px;
}

.campo-grupo label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: bold;
  color: #374151;
}

input {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  outline: none;
}

input:focus {
  border-color: #15803d;
}

button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  background: #15803d;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#dadosPrimeiraEntrada {
  display: none;
  margin-top: 5px;
}

.aviso-primeira {
  background: #fef3c7;
  color: #92400e;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 14px;
  line-height: 1.4;
  text-align: left;
}

#mensagem {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  font-weight: bold;
  white-space: pre-line;
}

.sucesso {
  display: block !important;
  background: #dcfce7;
  color: #166534;
}

.erro {
  display: block !important;
  background: #fee2e2;
  color: #991b1b;
}


/* =====================================================
   FILA
   ===================================================== */

.fila-card {
  text-align: left;
}

.fila-titulo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.contador {
  background: #e5e7eb;
  color: #374151;
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 13px;
  font-weight: bold;
}

#fila {
  width: 100%;
}

.item-fila {
  display: flex;
  align-items: center;
  padding: 14px 5px;
  border-bottom: 1px solid #e5e7eb;
}

.item-fila:last-child {
  border-bottom: 0;
}

.posicao {
  width: 55px;
  font-size: 20px;
  font-weight: bold;
  color: #111827;
}

.nome-fila {
  flex: 1;
  font-size: 17px;
  font-weight: bold;
  color: #111827;
}

.sua-posicao {
  background: #dcfce7;
  border-radius: 10px;
  padding-left: 8px;
  padding-right: 8px;
}

.voce {
  margin-left: 8px;
  font-size: 11px;
  padding: 4px 7px;
  border-radius: 12px;
  background: #15803d;
  color: white;
  font-weight: bold;
}

.vazio {
  color: #6b7280;
  text-align: center;
  padding: 20px 5px;
}

.atualizando {
  color: #6b7280;
  font-size: 12px;
  text-align: center;
  margin-top: 12px;
}

</style>

</head>


<body>

<div class="container">


  <!-- =================================================
       ENTRADA
       ================================================= -->

  <div class="card">

    <div class="icone">
      🛵
    </div>

    <h1>
      Pizzaria Di Roma
    </h1>

    <div class="subtitulo">
      Informe seu nome para entrar ou retornar à fila.
    </div>


    <div class="campo-grupo">

      <label for="nome">
        Nome
      </label>

      <input
        id="nome"
        type="text"
        placeholder="Digite seu nome"
        autocomplete="off"
        maxlength="50"
      >

    </div>



    <!-- ===============================================
         APARECE SOMENTE NA PRIMEIRA ENTRADA
         =============================================== -->

    <div id="dadosPrimeiraEntrada">

      <div class="aviso-primeira">
        📋 Como esta é sua primeira entrada de hoje,
        informe também o número da Bag e da Máquina.
      </div>


      <div class="campo-grupo">

        <label for="bag">
          Nº da Bag
        </label>

        <input
          id="bag"
          type="text"
          inputmode="numeric"
          placeholder="Ex.: 12"
          autocomplete="off"
          maxlength="20"
        >

      </div>


      <div class="campo-grupo">

        <label for="maquina">
          Máquina
        </label>

        <input
          id="maquina"
          type="text"
          inputmode="numeric"
          placeholder="Ex.: 03"
          autocomplete="off"
          maxlength="20"
        >

      </div>

    </div>



    <button
      id="botao"
      onclick="acaoPrincipal()"
    >
      CONTINUAR
    </button>


    <div id="mensagem"></div>

  </div>



  <!-- =================================================
       FILA ATUAL
       ================================================= -->

  <div class="card fila-card">

    <div class="fila-titulo">

      <h2>
        🟢 Fila atual
      </h2>

      <span
        id="contadorFila"
        class="contador"
      >
        0
      </span>

    </div>


    <div id="fila">
      Carregando fila...
    </div>


    <div class="atualizando">
      A fila é atualizada automaticamente.
    </div>

  </div>


</div>



<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nmkkabthynytwevadthq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pvTjmMDG1aC7qDyYW3kEZA_WR9-a-E3";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   VARIÁVEIS
   ===================================================== */

let primeiroCadastroPendente =
  false;


let nomePendente =
  "";


let nomeNormalizadoPendente =
  "";


let ultimoNomeNormalizado =
  "";



/* =====================================================
   NORMALIZAR NOME

   João
   JOÃO
   Joao
   joao

   serão considerados iguais.
   ===================================================== */

function normalizarNome(
  nome
) {

  return nome

    .trim()

    .replace(
      /\s+/g,
      " "
    )

    .normalize(
      "NFD"
    )

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase();

}



/* =====================================================
   FORMATAR NOME
   ===================================================== */

function formatarNome(
  nome
) {

  return nome
    .trim()
    .replace(
      /\s+/g,
      " "
    );

}



/* =====================================================
   SEGURANÇA HTML
   ===================================================== */

function esc(
  texto
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    texto;


  return div.innerHTML;

}



/* =====================================================
   MENSAGEM
   ===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    texto;


  mensagem.className =
    tipo;

}



function limparMensagem() {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    "";


  mensagem.className =
    "";

}



/* =====================================================
   CARREGAR FILA
   ===================================================== */

async function carregarFila() {

  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,nome,status,posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const fila =
      resposta.data || [];


    const elemento =
      document.getElementById(
        "fila"
      );


    const contador =
      document.getElementById(
        "contadorFila"
      );


    contador.innerText =
      fila.length;



    if (
      fila.length === 0
    ) {

      elemento.innerHTML =
        '<div class="vazio">' +
        'Nenhum motoboy disponível no momento.' +
        '</div>';


      return;

    }


    elemento.innerHTML =
      "";



    fila.forEach(
      (moto, index) => {


        const nomeNormalizado =
          normalizarNome(
            moto.nome
          );


        const ehUsuarioAtual =
          ultimoNomeNormalizado &&
          nomeNormalizado ===
          ultimoNomeNormalizado;



        elemento.innerHTML += `

          <div
            class="item-fila
            ${ehUsuarioAtual ? "sua-posicao" : ""}"
          >

            <div class="posicao">

              ${index + 1}º

            </div>


            <div class="nome-fila">

              ${esc(moto.nome)}

              ${
                ehUsuarioAtual
                  ?
                  '<span class="voce">VOCÊ</span>'
                  :
                  ""
              }

            </div>

          </div>

        `;


      }
    );


  } catch (erro) {


    console.error(
      "Erro ao carregar fila:",
      erro
    );

  }

}



/* =====================================================
   DESCOBRIR POSIÇÃO
   ===================================================== */

async function descobrirPosicao(
  nomeNormalizado
) {


  const resposta =
    await supabaseClient
      .from("motoboys")
      .select(
        "id,nome,posicao,status"
      )
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending: true
        }
      );


  if (
    resposta.error
  ) {

    throw resposta.error;

  }


  const fila =
    resposta.data || [];


  const indice =
    fila.findIndex(
      moto =>
        normalizarNome(
          moto.nome
        ) ===
        nomeNormalizado
    );


  if (
    indice === -1
  ) {

    return null;

  }


  return indice + 1;

}



/* =====================================================
   BOTÃO PRINCIPAL

   Primeiro verifica o nome.

   Se for primeira entrada:
   mostra Bag e Máquina.

   Se já existir:
   processa retorno ou duplicidade.
   ===================================================== */

async function acaoPrincipal() {


  if (
    primeiroCadastroPendente
  ) {


    await cadastrarPrimeiraEntrada();


  } else {


    await verificarMotoboy();

  }

}



/* =====================================================
   VERIFICAR MOTOBOY
   ===================================================== */

async function verificarMotoboy() {


  limparMensagem();


  const campoNome =
    document.getElementById(
      "nome"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  const nome =
    formatarNome(
      campoNome.value
    );


  const nomeComparacao =
    normalizarNome(
      nome
    );



  if (!nome) {


    mostrarMensagem(
      "Digite seu nome.",
      "erro"
    );


    campoNome.focus();


    return;

  }



  if (!nomeComparacao) {


    mostrarMensagem(
      "Digite um nome válido.",
      "erro"
    );


    return;

  }



  botao.disabled =
    true;


  botao.innerText =
    "VERIFICANDO...";



  try {


    /*
      Busca todos que estão ativos no dia.

      A comparação é feita no navegador
      ignorando acentos e letras maiúsculas.
    */

    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .in(
          "status",
          [
            "disponivel",
            "em_entrega"
          ]
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const registros =
      resposta.data || [];



    const ativo =
      registros.find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeComparacao
      );



    /* =================================================
       MOTOBOY JÁ EXISTE
       ================================================= */

    if (
      ativo
    ) {


      ultimoNomeNormalizado =
        nomeComparacao;



      /* ===============================================
         ESTAVA EM ENTREGA = RETORNO
         =============================================== */

      if (
        ativo.status ===
        "em_entrega"
      ) {


        await retornarParaFila(
          ativo,
          nomeComparacao
        );


      } else {


        /*
          Já está disponível.
          Não deixa duplicar.
        */

        await carregarFila();


        const posicao =
          await descobrirPosicao(
            nomeComparacao
          );


        mostrarMensagem(
          "⚠️ " +
          ativo.nome +
          " já está na fila." +
          (
            posicao
              ?
              "\n\nSua posição atual: " +
              posicao +
              "º"
              :
              ""
          ),
          "erro"
        );


        campoNome.value =
          "";

      }



      botao.disabled =
        false;


      botao.innerText =
        "CONTINUAR";


      return;

    }



    /* =================================================
       NÃO EXISTE

       É A PRIMEIRA ENTRADA DO DIA.
       Mostra Bag e Máquina.
       ================================================= */

    nomePendente =
      nome;


    nomeNormalizadoPendente =
      nomeComparacao;


    primeiroCadastroPendente =
      true;



    document
      .getElementById(
        "dadosPrimeiraEntrada"
      )
      .style.display =
      "block";


    /*
      Trava o nome para ele não ser
      alterado entre uma etapa e outra.
    */

    campoNome.disabled =
      true;



    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";


    mostrarMensagem(
      "Primeira entrada de hoje.\n\nInforme sua Bag e Máquina.",
      "sucesso"
    );


    document
      .getElementById(
        "bag"
      )
      .focus();



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível verificar seu cadastro.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "CONTINUAR";

  }

}



/* =====================================================
   PRIMEIRA ENTRADA

   Salva:
   nome
   bag
   maquina
   horário
   posição
   ===================================================== */

async function cadastrarPrimeiraEntrada() {


  limparMensagem();


  const campoBag =
    document.getElementById(
      "bag"
    );


  const campoMaquina =
    document.getElementById(
      "maquina"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  const bag =
    campoBag.value.trim();


  const maquina =
    campoMaquina.value.trim();



  if (!bag) {


    mostrarMensagem(
      "Informe o número da Bag.",
      "erro"
    );


    campoBag.focus();


    return;

  }



  if (!maquina) {


    mostrarMensagem(
      "Informe a Máquina.",
      "erro"
    );


    campoMaquina.focus();


    return;

  }



  botao.disabled =
    true;


  botao.innerText =
    "ENTRANDO...";



  try {


    /*
      Faz uma segunda verificação antes
      de inserir.

      Isso ajuda a evitar duas entradas
      caso o botão seja acionado em
      situações muito próximas.
    */

    const verificacao =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .in(
          "status",
          [
            "disponivel",
            "em_entrega"
          ]
        );


    if (
      verificacao.error
    ) {

      throw verificacao.error;

    }



    const duplicado =
      (
        verificacao.data ||
        []
      )
      .find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeNormalizadoPendente
      );



    if (
      duplicado
    ) {


      primeiroCadastroPendente =
        false;


      document
        .getElementById(
          "dadosPrimeiraEntrada"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "nome"
        )
        .disabled =
        false;


      mostrarMensagem(
        "⚠️ Esse motoboy já foi registrado.",
        "erro"
      );


      botao.disabled =
        false;


      botao.innerText =
        "CONTINUAR";


      return;

    }



    /* ===============================================
       ÚLTIMA POSIÇÃO DA FILA
       =============================================== */

    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select("posicao")
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();



    if (
      maiorPosicao.error
    ) {

      throw maiorPosicao.error;

    }



    const ultimaPosicao =
      maiorPosicao.data?.posicao ||
      0;



    const agora =
      new Date()
        .toISOString();



    /* ===============================================
       CRIA REGISTRO
       =============================================== */

    const novo =
      await supabaseClient
        .from("motoboys")
        .insert({

          nome:
            nomePendente,

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1,

          primeira_chegada:
            agora,

          bag:
            bag,

          maquina:
            maquina

        })
        .select()
        .single();



    if (
      novo.error
    ) {

      throw novo.error;

    }



    ultimoNomeNormalizado =
      nomeNormalizadoPendente;



    await carregarFila();



    const posicao =
      await descobrirPosicao(
        nomeNormalizadoPendente
      );



    mostrarMensagem(
      "✅ " +
      nomePendente +
      " entrou na fila!" +
      "\n\nBag: " +
      bag +
      " | Máquina: " +
      maquina +
      (
        posicao
          ?
          "\n\nSua posição atual: " +
          posicao +
          "º"
          :
          ""
      ),
      "sucesso"
    );



    limparFormulario();



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível entrar na fila.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";

  }

}



/* =====================================================
   RETORNO DA ENTREGA

   NÃO pede Bag e Máquina novamente.
   ===================================================== */

async function retornarParaFila(
  ativo,
  nomeComparacao
) {


  const campoNome =
    document.getElementById(
      "nome"
    );



  const maiorPosicao =
    await supabaseClient
      .from("motoboys")
      .select("posicao")
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending: false
        }
      )
      .limit(1)
      .maybeSingle();



  if (
    maiorPosicao.error
  ) {

    throw maiorPosicao.error;

  }



  const ultimaPosicao =
    maiorPosicao.data?.posicao ||
    0;



  const retorno =
    await supabaseClient
      .from("motoboys")
      .update({

        status:
          "disponivel",

        posicao:
          ultimaPosicao + 1

      })
      .eq(
        "id",
        ativo.id
      );



  if (
    retorno.error
  ) {

    throw retorno.error;

  }



  await carregarFila();



  const posicao =
    await descobrirPosicao(
      nomeComparacao
    );



  mostrarMensagem(
    "🔄 " +
    ativo.nome +
    " retornou para a fila!" +
    (
      posicao
        ?
        "\n\nSua posição atual: " +
        posicao +
        "º"
        :
        ""
    ),
    "sucesso"
  );



  campoNome.value =
    "";

}



/* =====================================================
   LIMPAR FORMULÁRIO
   ===================================================== */

function limparFormulario() {


  document
    .getElementById(
      "nome"
    )
    .value =
    "";


  document
    .getElementById(
      "nome"
    )
    .disabled =
    false;


  document
    .getElementById(
      "bag"
    )
    .value =
    "";


  document
    .getElementById(
      "maquina"
    )
    .value =
    "";


  document
    .getElementById(
      "dadosPrimeiraEntrada"
    )
    .style.display =
    "none";


  primeiroCadastroPendente =
    false;


  nomePendente =
    "";


  nomeNormalizadoPendente =
    "";


  const botao =
    document.getElementById(
      "botao"
    );


  botao.disabled =
    false;


  botao.innerText =
    "CONTINUAR";

}



/* =====================================================
   ENTER NO TECLADO
   ===================================================== */

document
  .getElementById(
    "nome"
  )
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key ===
        "Enter"
      ) {


        acaoPrincipal();

      }

    }
  );



document
  .getElementById(
    "bag"
  )
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key ===
        "Enter"
      ) {


        document
          .getElementById(
            "maquina"
          )
          .focus();

      }

    }
  );



document
  .getElementById(
    "maquina"
  )
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key ===
        "Enter"
      ) {


        cadastrarPrimeiraEntrada();

      }

    }
  );



/* =====================================================
   REALTIME
   ===================================================== */

supabaseClient

  .channel(
    "fila-publica-motoboys"
  )

  .on(
    "postgres_changes",
    {

      event:
        "*",

      schema:
        "public",

      table:
        "motoboys"

    },

    function() {


      carregarFila();

    }

  )

  .subscribe();



/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
   ===================================================== */

setInterval(
  carregarFila,
  3000
);



/* =====================================================
   QUANDO VOLTAR PARA A ABA
   ===================================================== */

document.addEventListener(
  "visibilitychange",
  function() {


    if (
      document.visibilityState ===
      "visible"
    ) {


      carregarFila();

    }

  }
);



/* =====================================================
   INICIAR
   ===================================================== */

carregarFila();


</script>
