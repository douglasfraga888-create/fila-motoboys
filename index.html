<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Entrada de Motoboy - Pizzaria Di Roma</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.card {
  width: 100%;
  background: white;
  padding: 30px 22px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.10);
  text-align: center;
  margin-bottom: 20px;
}

.icone {
  font-size: 55px;
  margin-bottom: 10px;
}

h1 {
  margin: 0 0 10px;
  font-size: 27px;
  color: #111827;
}

h2 {
  margin: 0;
  font-size: 22px;
  color: #111827;
}

.subtitulo {
  color: #6b7280;
  margin-bottom: 25px;
  line-height: 1.4;
}

.campo-grupo {
  text-align: left;
  margin-bottom: 15px;
}

.campo-grupo label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: bold;
  color: #374151;
}

input {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  outline: none;
}

input:focus {
  border-color: #15803d;
}

button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  background: #15803d;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.botao-retorno {
  background: #15803d;
  font-size: 19px;
}

.botao-trocar {
  margin-top: 12px;
  background: #6b7280;
  font-size: 14px;
  padding: 12px;
}

#dadosPrimeiraEntrada {
  display: none;
}

#areaReconhecido {
  display: none;
}

.motoboy-reconhecido {
  font-size: 22px;
  font-weight: bold;
  color: #111827;
  margin-bottom: 10px;
}

.status-reconhecido {
  margin-bottom: 20px;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
}

.status-disponivel {
  background: #dcfce7;
  color: #166534;
}

.status-entrega {
  background: #fef3c7;
  color: #92400e;
}

.aviso-primeira {
  background: #fef3c7;
  color: #92400e;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 14px;
  line-height: 1.4;
  text-align: left;
}

#mensagem {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  font-weight: bold;
  white-space: pre-line;
}

.sucesso {
  display: block !important;
  background: #dcfce7;
  color: #166534;
}

.erro {
  display: block !important;
  background: #fee2e2;
  color: #991b1b;
}


/* =====================================================
   FILA
   ===================================================== */

.fila-card {
  text-align: left;
}

.fila-titulo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.contador {
  background: #e5e7eb;
  color: #374151;
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 13px;
  font-weight: bold;
}

.item-fila {
  display: flex;
  align-items: center;
  padding: 14px 5px;
  border-bottom: 1px solid #e5e7eb;
}

.item-fila:last-child {
  border-bottom: 0;
}

.posicao {
  width: 55px;
  font-size: 20px;
  font-weight: bold;
}

.nome-fila {
  flex: 1;
  font-size: 17px;
  font-weight: bold;
}

.sua-posicao {
  background: #dcfce7;
  border-radius: 10px;
  padding-left: 8px;
  padding-right: 8px;
}

.voce {
  margin-left: 8px;
  font-size: 11px;
  padding: 4px 7px;
  border-radius: 12px;
  background: #15803d;
  color: white;
  font-weight: bold;
}

.vazio {
  color: #6b7280;
  text-align: center;
  padding: 20px 5px;
}

.atualizando {
  color: #6b7280;
  font-size: 12px;
  text-align: center;
  margin-top: 12px;
}

</style>

</head>


<body>

<div class="container">


  <!-- =================================================
       ENTRADA / IDENTIFICAÇÃO
       ================================================= -->

  <div class="card">

    <div class="icone">
      🛵
    </div>

    <h1>
      Pizzaria Di Roma
    </h1>


    <!-- ===============================================
         ÁREA DE IDENTIFICAÇÃO
         =============================================== -->

    <div id="areaEntrada">

      <div class="subtitulo">
        Informe seu nome para entrar na fila.
      </div>


      <div class="campo-grupo">

        <label for="nome">
          Nome
        </label>

        <input
          id="nome"
          type="text"
          placeholder="Digite seu nome"
          autocomplete="off"
          maxlength="50"
        >

      </div>



      <div id="dadosPrimeiraEntrada">

        <div class="aviso-primeira">
          📋 Primeira entrada do dia. Informe também sua Bag e Máquina.
        </div>


        <div class="campo-grupo">

          <label for="bag">
            Nº da Bag
          </label>

          <input
            id="bag"
            type="text"
            inputmode="numeric"
            placeholder="Ex.: 12"
            autocomplete="off"
            maxlength="20"
          >

        </div>


        <div class="campo-grupo">

          <label for="maquina">
            Máquina
          </label>

          <input
            id="maquina"
            type="text"
            inputmode="numeric"
            placeholder="Ex.: 03"
            autocomplete="off"
            maxlength="20"
          >

        </div>

      </div>


      <button
        id="botao"
        onclick="acaoPrincipal()"
      >
        CONTINUAR
      </button>

    </div>



    <!-- ===============================================
         ÁREA DO MOTOBOY JÁ RECONHECIDO
         =============================================== -->

    <div id="areaReconhecido">

      <div
        id="nomeReconhecido"
        class="motoboy-reconhecido"
      >
      </div>


      <div
        id="statusReconhecido"
        class="status-reconhecido"
      >
      </div>


      <button
        id="botaoRetorno"
        class="botao-retorno"
        onclick="retornarMotoboyReconhecido()"
      >
        🔄 RETORNAR À FILA
      </button>


      <button
        class="botao-trocar"
        onclick="naoSouEsteMotoboy()"
      >
        NÃO SOU ESTE MOTOBOY
      </button>

    </div>


    <div id="mensagem"></div>

  </div>



  <!-- =================================================
       FILA
       ================================================= -->

  <div class="card fila-card">

    <div class="fila-titulo">

      <h2>
        🟢 Fila atual
      </h2>

      <span
        id="contadorFila"
        class="contador"
      >
        0
      </span>

    </div>


    <div id="fila">
      Carregando fila...
    </div>


    <div class="atualizando">
      A fila é atualizada automaticamente.
    </div>

  </div>


</div>



<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nmkkabthynytwevadthq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pvTjmMDG1aC7qDyYW3kEZA_WR9-a-E3";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   VARIÁVEIS
   ===================================================== */

let primeiroCadastroPendente =
  false;


let nomePendente =
  "";


let nomeNormalizadoPendente =
  "";


let ultimoNomeNormalizado =
  "";


let motoboyReconhecido =
  null;



/* =====================================================
   NORMALIZAR NOME
   ===================================================== */

function normalizarNome(
  nome
) {

  return nome
    .trim()
    .replace(
      /\s+/g,
      " "
    )
    .normalize(
      "NFD"
    )
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase();

}



/* =====================================================
   FORMATAR NOME
   ===================================================== */

function formatarNome(
  nome
) {

  return nome
    .trim()
    .replace(
      /\s+/g,
      " "
    );

}



/* =====================================================
   SEGURANÇA HTML
   ===================================================== */

function esc(
  texto
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    texto || "";

  return div.innerHTML;

}



/* =====================================================
   MENSAGEM
   ===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    texto;


  mensagem.className =
    tipo;

}



function limparMensagem() {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    "";


  mensagem.className =
    "";

}



/* =====================================================
   SALVAR IDENTIFICAÇÃO NO CELULAR
   ===================================================== */

function salvarIdentificacao(
  moto
) {

  localStorage.setItem(
    "motoboy_id",
    String(moto.id)
  );


  localStorage.setItem(
    "motoboy_nome",
    moto.nome
  );

}



/* =====================================================
   LIMPAR IDENTIFICAÇÃO
   ===================================================== */

function limparIdentificacao() {

  localStorage.removeItem(
    "motoboy_id"
  );


  localStorage.removeItem(
    "motoboy_nome"
  );


  motoboyReconhecido =
    null;


  ultimoNomeNormalizado =
    "";

}



/* =====================================================
   VERIFICAR MOTOBOY SALVO NO CELULAR
   ===================================================== */

async function verificarIdentificacaoSalva() {


  const idSalvo =
    localStorage.getItem(
      "motoboy_id"
    );


  if (!idSalvo) {

    mostrarAreaEntrada();

    return;

  }



  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          idSalvo
        )
        .maybeSingle();


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const moto =
      resposta.data;



    /*
      Se o registro não existir mais,
      provavelmente o dia foi encerrado.
    */

    if (!moto) {


      limparIdentificacao();


      mostrarAreaEntrada();


      return;

    }



    motoboyReconhecido =
      moto;


    ultimoNomeNormalizado =
      normalizarNome(
        moto.nome
      );


    mostrarAreaReconhecido(
      moto
    );


  } catch (erro) {


    console.error(
      "Erro ao reconhecer motoboy:",
      erro
    );


    mostrarAreaEntrada();

  }

}



/* =====================================================
   MOSTRAR ÁREA DE ENTRADA
   ===================================================== */

function mostrarAreaEntrada() {


  document
    .getElementById(
      "areaEntrada"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =
    "none";

}



/* =====================================================
   MOSTRAR MOTOBOY RECONHECIDO
   ===================================================== */

async function mostrarAreaReconhecido(
  moto
) {


  document
    .getElementById(
      "areaEntrada"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "nomeReconhecido"
    )
    .innerText =
    moto.nome;


  const status =
    document.getElementById(
      "statusReconhecido"
    );


  const botaoRetorno =
    document.getElementById(
      "botaoRetorno"
    );



  if (
    moto.status ===
    "em_entrega"
  ) {


    status.className =
      "status-reconhecido status-entrega";


    status.innerText =
      "🛵 Você está em entrega.";


    botaoRetorno.style.display =
      "block";



  } else if (
    moto.status ===
    "disponivel"
  ) {


    status.className =
      "status-reconhecido status-disponivel";


    const posicao =
      await descobrirPosicaoPorId(
        moto.id
      );


    status.innerText =
      "✅ Você está disponível." +
      (
        posicao
          ?
          "\nSua posição atual: " +
          posicao +
          "º"
          :
          ""
      );


    botaoRetorno.style.display =
      "none";



  } else {


    status.innerText =
      "Status não identificado.";


    botaoRetorno.style.display =
      "none";

  }

}



/* =====================================================
   NÃO SOU ESTE MOTOBOY
   ===================================================== */

function naoSouEsteMotoboy() {


  const confirmar =
    confirm(
      "Deseja trocar a identificação deste aparelho?"
    );


  if (!confirmar) {

    return;

  }


  limparIdentificacao();


  limparFormulario();


  mostrarAreaEntrada();


  limparMensagem();

}



/* =====================================================
   CARREGAR FILA
   ===================================================== */

async function carregarFila() {


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,nome,status,posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const fila =
      resposta.data || [];


    const elemento =
      document.getElementById(
        "fila"
      );


    document
      .getElementById(
        "contadorFila"
      )
      .innerText =
      fila.length;



    if (
      fila.length === 0
    ) {


      elemento.innerHTML =
        '<div class="vazio">' +
        'Nenhum motoboy disponível no momento.' +
        '</div>';


      return;

    }



    elemento.innerHTML =
      "";



    fila.forEach(
      (moto, index) => {


        const ehUsuarioAtual =
          ultimoNomeNormalizado &&
          normalizarNome(
            moto.nome
          ) ===
          ultimoNomeNormalizado;



        elemento.innerHTML += `

          <div
            class="item-fila
            ${ehUsuarioAtual ? "sua-posicao" : ""}"
          >

            <div class="posicao">

              ${index + 1}º

            </div>


            <div class="nome-fila">

              ${esc(moto.nome)}

              ${
                ehUsuarioAtual
                  ?
                  '<span class="voce">VOCÊ</span>'
                  :
                  ""
              }

            </div>

          </div>

        `;


      }
    );


  } catch (erro) {


    console.error(
      "Erro ao carregar fila:",
      erro
    );

  }

}



/* =====================================================
   DESCOBRIR POSIÇÃO PELO ID
   ===================================================== */

async function descobrirPosicaoPorId(
  id
) {


  const resposta =
    await supabaseClient
      .from("motoboys")
      .select(
        "id,posicao"
      )
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending: true
        }
      );


  if (
    resposta.error
  ) {

    throw resposta.error;

  }


  const fila =
    resposta.data || [];


  const indice =
    fila.findIndex(
      moto =>
        String(moto.id) ===
        String(id)
    );


  if (
    indice === -1
  ) {

    return null;

  }


  return indice + 1;

}



/* =====================================================
   AÇÃO PRINCIPAL
   ===================================================== */

async function acaoPrincipal() {


  if (
    primeiroCadastroPendente
  ) {


    await cadastrarPrimeiraEntrada();


  } else {


    await verificarMotoboy();

  }

}



/* =====================================================
   VERIFICAR NOME
   ===================================================== */

async function verificarMotoboy() {


  limparMensagem();


  const campoNome =
    document.getElementById(
      "nome"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  const nome =
    formatarNome(
      campoNome.value
    );


  const nomeComparacao =
    normalizarNome(
      nome
    );



  if (!nome) {


    mostrarMensagem(
      "Digite seu nome.",
      "erro"
    );


    return;

  }



  botao.disabled =
    true;


  botao.innerText =
    "VERIFICANDO...";



  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .in(
          "status",
          [
            "disponivel",
            "em_entrega"
          ]
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }



    const ativo =
      (
        resposta.data ||
        []
      )
      .find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeComparacao
      );



    /*
      O motoboy já existe.

      Salva a identificação no aparelho.
    */

    if (
      ativo
    ) {


      salvarIdentificacao(
        ativo
      );


      motoboyReconhecido =
        ativo;


      ultimoNomeNormalizado =
        normalizarNome(
          ativo.nome
        );


      campoNome.value =
        "";


      await carregarFila();


      await mostrarAreaReconhecido(
        ativo
      );


      botao.disabled =
        false;


      botao.innerText =
        "CONTINUAR";


      return;

    }



    /*
      Primeira entrada.
    */

    nomePendente =
      nome;


    nomeNormalizadoPendente =
      nomeComparacao;


    primeiroCadastroPendente =
      true;


    document
      .getElementById(
        "dadosPrimeiraEntrada"
      )
      .style.display =
      "block";


    campoNome.disabled =
      true;


    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";


    mostrarMensagem(
      "Primeira entrada de hoje.\n\nInforme sua Bag e Máquina.",
      "sucesso"
    );


    document
      .getElementById(
        "bag"
      )
      .focus();



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível verificar.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "CONTINUAR";

  }

}



/* =====================================================
   PRIMEIRA ENTRADA
   ===================================================== */

async function cadastrarPrimeiraEntrada() {


  const bag =
    document
      .getElementById(
        "bag"
      )
      .value
      .trim();


  const maquina =
    document
      .getElementById(
        "maquina"
      )
      .value
      .trim();


  const botao =
    document.getElementById(
      "botao"
    );



  if (!bag) {


    mostrarMensagem(
      "Informe o número da Bag.",
      "erro"
    );


    return;

  }



  if (!maquina) {


    mostrarMensagem(
      "Informe a Máquina.",
      "erro"
    );


    return;

  }



  botao.disabled =
    true;


  botao.innerText =
    "ENTRANDO...";



  try {


    /*
      Verifica duplicidade novamente.
    */

    const verificacao =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .in(
          "status",
          [
            "disponivel",
            "em_entrega"
          ]
        );


    if (
      verificacao.error
    ) {

      throw verificacao.error;

    }



    const duplicado =
      (
        verificacao.data ||
        []
      )
      .find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeNormalizadoPendente
      );



    if (
      duplicado
    ) {


      salvarIdentificacao(
        duplicado
      );


      motoboyReconhecido =
        duplicado;


      ultimoNomeNormalizado =
        normalizarNome(
          duplicado.nome
        );


      limparFormulario();


      await mostrarAreaReconhecido(
        duplicado
      );


      await carregarFila();


      return;

    }



    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select("posicao")
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();



    if (
      maiorPosicao.error
    ) {

      throw maiorPosicao.error;

    }



    const ultimaPosicao =
      maiorPosicao.data?.posicao ||
      0;



    const novo =
      await supabaseClient
        .from("motoboys")
        .insert({

          nome:
            nomePendente,

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1,

          primeira_chegada:
            new Date().toISOString(),

          bag:
            bag,

          maquina:
            maquina

        })
        .select()
        .single();



    if (
      novo.error
    ) {

      throw novo.error;

    }



    salvarIdentificacao(
      novo.data
    );


    motoboyReconhecido =
      novo.data;


    ultimoNomeNormalizado =
      normalizarNome(
        novo.data.nome
      );


    limparFormulario();


    await carregarFila();


    await mostrarAreaReconhecido(
      novo.data
    );


    mostrarMensagem(
      "✅ Entrada registrada com sucesso!",
      "sucesso"
    );



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível entrar na fila.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";

  }

}



/* =====================================================
   BOTÃO RETORNAR À FILA
   ===================================================== */

async function retornarMotoboyReconhecido() {


  if (
    !motoboyReconhecido
  ) {

    return;

  }


  const botao =
    document.getElementById(
      "botaoRetorno"
    );


  botao.disabled =
    true;


  botao.innerText =
    "RETORNANDO...";



  try {


    /*
      Busca o status atual novamente.
    */

    const busca =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          motoboyReconhecido.id
        )
        .maybeSingle();



    if (
      busca.error
    ) {

      throw busca.error;

    }



    const moto =
      busca.data;



    if (!moto) {


      limparIdentificacao();


      mostrarAreaEntrada();


      mostrarMensagem(
        "Seu registro não foi encontrado. Faça uma nova entrada.",
        "erro"
      );


      return;

    }



    if (
      moto.status ===
      "disponivel"
    ) {


      motoboyReconhecido =
        moto;


      await mostrarAreaReconhecido(
        moto
      );


      mostrarMensagem(
        "Você já está na fila.",
        "erro"
      );


      return;

    }



    if (
      moto.status !==
      "em_entrega"
    ) {


      mostrarMensagem(
        "Não foi possível realizar o retorno.",
        "erro"
      );


      return;

    }



    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select("posicao")
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();



    if (
      maiorPosicao.error
    ) {

      throw maiorPosicao.error;

    }



    const ultimaPosicao =
      maiorPosicao.data?.posicao ||
      0;



    const retorno =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1

        })
        .eq(
          "id",
          moto.id
        )
        .select()
        .single();



    if (
      retorno.error
    ) {

      throw retorno.error;

    }



    motoboyReconhecido =
      retorno.data;


    await carregarFila();


    await mostrarAreaReconhecido(
      retorno.data
    );


    mostrarMensagem(
      "🔄 Você retornou para o final da fila!",
      "sucesso"
    );



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível retornar à fila.\n\n" +
      erro.message,
      "erro"
    );


  } finally {


    botao.disabled =
      false;


    botao.innerText =
      "🔄 RETORNAR À FILA";

  }

}

/* =====================================================
   REALTIME
   ===================================================== */

supabaseClient

  .channel(
    "fila-motoboy-retorno"
  )

  .on(
    "postgres_changes",
    {

      event:
        "*",

      schema:
        "public",

      table:
        "motoboys"

    },

    async function() {


      await carregarFila();


      /*
        Atualiza também o status
        do motoboy reconhecido.
      */

      if (
        motoboyReconhecido
      ) {


        const resposta =
          await supabaseClient
            .from("motoboys")
            .select("*")
            .eq(
              "id",
              motoboyReconhecido.id
            )
            .maybeSingle();


        if (
          resposta.data
        ) {


          motoboyReconhecido =
            resposta.data;


          await mostrarAreaReconhecido(
            resposta.data
          );

        }

      }

    }

  )

  .subscribe();



/* =====================================================
   ATUALIZAÇÃO A CADA 3 SEGUNDOS
   ===================================================== */

setInterval(
  async function() {


    await carregarFila();


    if (
      motoboyReconhecido
    ) {


      const resposta =
        await supabaseClient
          .from("motoboys")
          .select("*")
          .eq(
            "id",
            motoboyReconhecido.id
          )
          .maybeSingle();


      if (
        resposta.data
      ) {


        motoboyReconhecido =
          resposta.data;


        await mostrarAreaReconhecido(
          resposta.data
        );

      }


      /*
        Se o dia foi encerrado,
        o registro desaparece.
      */

      if (
        !resposta.data &&
        !resposta.error
      ) {


        limparIdentificacao();


        mostrarAreaEntrada();

      }

    }


  },
  3000
);



/* =====================================================
   AO ABRIR A PÁGINA
   ===================================================== */

async function iniciar() {


  await carregarFila();


  await verificarIdentificacaoSalva();

}


iniciar();
