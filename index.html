<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nmkkabthynytwevadthq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pvTjmMDG1aC7qDyYW3kEZA_WR9-a-E3";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   VARIÁVEIS
   ===================================================== */

let primeiroCadastroPendente =
  false;


let nomePendente =
  "";


let nomeNormalizadoPendente =
  "";


let ultimoNomeNormalizado =
  "";


let motoboyReconhecido =
  null;



/* =====================================================
   NORMALIZAR NOME

   JOÃO = JOAO = joão = joao
   ===================================================== */

function normalizarNome(nome) {

  return String(
    nome || ""
  )

    .trim()

    .replace(
      /\s+/g,
      " "
    )

    .normalize(
      "NFD"
    )

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase();

}



/* =====================================================
   FORMATAR NOME
   ===================================================== */

function formatarNome(nome) {

  return String(
    nome || ""
  )

    .trim()

    .replace(
      /\s+/g,
      " "
    );

}



/* =====================================================
   HTML SEGURO
   ===================================================== */

function esc(texto) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    texto || "";


  return div.innerHTML;

}



/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    texto;


  mensagem.className =
    tipo;

}


function limparMensagem() {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    "";


  mensagem.className =
    "";

}



/* =====================================================
   IDENTIFICAÇÃO LOCAL
   ===================================================== */

function salvarIdentificacao(moto) {

  localStorage.setItem(
    "motoboy_id",
    String(moto.id)
  );


  localStorage.setItem(
    "motoboy_nome",
    moto.nome
  );

}


function limparIdentificacao() {

  localStorage.removeItem(
    "motoboy_id"
  );


  localStorage.removeItem(
    "motoboy_nome"
  );


  motoboyReconhecido =
    null;


  ultimoNomeNormalizado =
    "";

}



/* =====================================================
   ÁREA DE ENTRADA
   ===================================================== */

function mostrarAreaEntrada() {

  document
    .getElementById(
      "areaEntrada"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =
    "none";

}



/* =====================================================
   ÁREA RECONHECIDA
   ===================================================== */

async function mostrarAreaReconhecido(moto) {

  document
    .getElementById(
      "areaEntrada"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =
    "block";


  const nome =
    document.getElementById(
      "nomeReconhecido"
    );


  const status =
    document.getElementById(
      "statusReconhecido"
    );


  const botaoAcao =
    document.getElementById(
      "botaoAcao"
    );


  const botaoSair =
    document.getElementById(
      "botaoSairFila"
    );


  nome.innerText =
    "🛵 " +
    moto.nome;


  botaoAcao.style.display =
    "none";


  botaoSair.style.display =
    "none";


  /* =================================================
     FECHADO
     ================================================= */

  if (
    moto.fechado === true
  ) {

    status.className =
      "status-reconhecido status-fechado";


    status.innerText =
      "🔒 Seu Grid foi fechado.\n\n" +
      "Você não pode retornar à fila hoje.";


    return;

  }



  /* =================================================
     EM ENTREGA
     ================================================= */

  if (
    moto.status ===
    "em_entrega"
  ) {

    status.className =
      "status-reconhecido status-entrega";


    status.innerText =
      "Você está em entrega.";


    botaoAcao.style.display =
      "block";


    botaoAcao.className =
      "botao-verde";


    botaoAcao.innerText =
      moto.nome +
      ", RETORNAR À FILA";


    return;

  }



  /* =================================================
     DISPONÍVEL
     ================================================= */

  if (
    moto.status ===
    "disponivel"
  ) {

    const posicao =
      await descobrirPosicaoPorId(
        moto.id
      );


    status.className =
      "status-reconhecido status-disponivel";


    status.innerText =
      "✅ Você está na fila." +
      (
        posicao
          ?
          "\n\nSua posição atual: " +
          posicao +
          "º"
          :
          ""
      );


    /*
      DISPONÍVEL PODE SAIR
      TEMPORARIAMENTE DA FILA.
    */

    botaoSair.style.display =
      "block";


    return;

  }



  /* =================================================
     FORA DA FILA

     NOVA FUNÇÃO.
     ================================================= */

  if (
    moto.status ===
    "fora_fila"
  ) {

    status.className =
      "status-reconhecido status-fora";


    status.innerText =
      "⏸ Você está temporariamente fora da fila.\n\n" +
      "Quando quiser voltar, toque no botão abaixo.";


    botaoAcao.style.display =
      "block";


    botaoAcao.className =
      "botao-azul";


    botaoAcao.innerText =
      "↩ VOLTAR PARA O FINAL DA FILA";


    return;

  }



  /* =================================================
     REMOVIDO PELO PAINEL
     ================================================= */

  if (
    moto.status ===
    "removido"
  ) {

    status.className =
      "status-reconhecido status-removido";


    status.innerText =
      "Você não está na fila no momento.";


    /*
      Mantém a lógica anterior:
      se não estiver fechado, poderá voltar.
    */

    botaoAcao.style.display =
      "block";


    botaoAcao.className =
      "botao-azul";


    botaoAcao.innerText =
      "VOLTAR PARA A FILA";


    return;

  }

}



/* =====================================================
   SAIR DA FILA

   NOVA FUNÇÃO

   NÃO APAGA O REGISTRO.
   NÃO ALTERA:
   - primeira_chegada
   - bag
   - maquina
   - Grid
   ===================================================== */

async function sairDaFila() {

  limparMensagem();


  if (
    !motoboyReconhecido
  ) {

    return;

  }


  const confirmar =
    confirm(
      "Deseja sair temporariamente da fila?\n\n" +
      "Seu registro continuará no Grid.\n\n" +
      "Quando voltar, você entrará na última posição."
    );


  if (!confirmar) {

    return;

  }


  try {


    /*
      CONFERE O STATUS ATUAL.
    */

    const busca =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          motoboyReconhecido.id
        )
        .maybeSingle();


    if (
      busca.error
    ) {

      throw busca.error;

    }


    const moto =
      busca.data;


    if (!moto) {

      limparIdentificacao();

      mostrarAreaEntrada();

      return;

    }


    if (
      moto.fechado === true
    ) {

      mostrarMensagem(
        "Seu Grid já foi fechado.",
        "erro"
      );

      return;

    }


    if (
      moto.status !==
      "disponivel"
    ) {

      mostrarMensagem(
        "Você não está disponível na fila neste momento.",
        "erro"
      );


      await atualizarMotoboyReconhecido();

      return;

    }



    /*
      APENAS MUDA O STATUS E RETIRA
      A POSIÇÃO DA FILA.

      O REGISTRO CONTINUA EXISTINDO.
    */

    const resposta =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "fora_fila",

          posicao:
            null

        })
        .eq(
          "id",
          moto.id
        )
        .select()
        .single();


    if (
      resposta.error
    ) {

      throw resposta.error;

    }



    motoboyReconhecido =
      resposta.data;


    /*
      REORGANIZA AS POSIÇÕES
      DOS MOTOBOYS QUE FICARAM.
    */

    await reorganizarFila();


    await carregarFila();


    await mostrarAreaReconhecido(
      resposta.data
    );


    mostrarMensagem(
      "⏸ Você saiu temporariamente da fila.\n\n" +
      "Quando retornar, abra novamente o QR Code e entre no final da fila.",
      "sucesso"
    );


  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível sair da fila.\n\n" +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   REORGANIZAR FILA
   ===================================================== */

async function reorganizarFila() {

  const resposta =
    await supabaseClient
      .from("motoboys")
      .select(
        "id,posicao"
      )
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending: true
        }
      );


  if (
    resposta.error
  ) {

    throw resposta.error;

  }


  const fila =
    resposta.data || [];


  for (
    let i = 0;
    i < fila.length;
    i++
  ) {

    const novaPosicao =
      i + 1;


    if (
      fila[i].posicao !==
      novaPosicao
    ) {

      const atualizacao =
        await supabaseClient
          .from("motoboys")
          .update({

            posicao:
              novaPosicao

          })
          .eq(
            "id",
            fila[i].id
          );


      if (
        atualizacao.error
      ) {

        throw atualizacao.error;

      }

    }

  }

}



/* =====================================================
   NÃO SOU ESTE MOTOBOY
   ===================================================== */

function naoSouEsteMotoboy() {

  const confirmar =
    confirm(
      "Deseja remover a identificação deste aparelho?"
    );


  if (!confirmar) {

    return;

  }


  limparIdentificacao();


  limparFormulario();


  mostrarAreaEntrada();


  limparMensagem();

}



/* =====================================================
   CARREGAR FILA
   ===================================================== */

async function carregarFila() {

  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,nome,status,posicao,fechado"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    /*
      GARANTIA EXTRA:
      FECHADO NÃO APARECE.
    */

    const fila =
      (
        resposta.data ||
        []
      )
      .filter(
        moto =>
          moto.fechado !== true
      );


    const elemento =
      document.getElementById(
        "fila"
      );


    document
      .getElementById(
        "contadorFila"
      )
      .innerText =
      fila.length;


    if (
      fila.length === 0
    ) {

      elemento.innerHTML =
        '<div class="vazio">' +
        'Nenhum motoboy disponível no momento.' +
        '</div>';


      return;

    }


    elemento.innerHTML =
      "";


    fila.forEach(
      (
        moto,
        index
      ) => {


        const ehUsuarioAtual =
          ultimoNomeNormalizado &&
          normalizarNome(
            moto.nome
          ) ===
          ultimoNomeNormalizado;


        elemento.innerHTML += `

          <div
            class="item-fila
            ${ehUsuarioAtual ? "sua-posicao" : ""}"
          >

            <div class="posicao">
              ${index + 1}º
            </div>


            <div class="nome-fila">

              ${esc(moto.nome)}

              ${
                ehUsuarioAtual
                  ?
                  '<span class="voce">VOCÊ</span>'
                  :
                  ""
              }

            </div>

          </div>

        `;

      }
    );


  } catch (erro) {

    console.error(
      "Erro ao carregar fila:",
      erro
    );

  }

}



/* =====================================================
   DESCOBRIR POSIÇÃO
   ===================================================== */

async function descobrirPosicaoPorId(id) {

  const resposta =
    await supabaseClient
      .from("motoboys")
      .select(
        "id,posicao"
      )
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending: true
        }
      );


  if (
    resposta.error
  ) {

    throw resposta.error;

  }


  const fila =
    resposta.data || [];


  const indice =
    fila.findIndex(
      moto =>
        String(moto.id) ===
        String(id)
    );


  if (
    indice === -1
  ) {

    return null;

  }


  return indice + 1;

}

   AÇÃO PRINCIPAL

  if (
    primeiroCadastroPendente
  ) {

    await cadastrarPrimeiraEntrada();

/* =====================================================
   VERIFICAR MOTOBOY
   ===================================================== */

async function verificarMotoboy() {

  limparMensagem();


  const campoNome =
    document.getElementById(
      "nome"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  const nome =
    formatarNome(
      campoNome.value
    );


  const nomeComparacao =
    normalizarNome(
      nome
    );


  if (!nome) {

    mostrarMensagem(
      "Digite seu nome.",
      "erro"
    );


    campoNome.focus();

    return;

  }


  botao.disabled =
    true;


  botao.innerText =
    "VERIFICANDO...";


  try {


    /*
      BUSCA TODOS OS REGISTROS DO DIA.

      Inclui fora_fila para não gerar
      uma segunda linha no Grid.
    */

    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*");


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const existente =
      (
        resposta.data ||
        []
      )
      .find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeComparacao
      );


    /* =================================================
       JÁ EXISTE
       ================================================= */

    if (
      existente
    ) {


      salvarIdentificacao(
        existente
      );


      motoboyReconhecido =
        existente;


      ultimoNomeNormalizado =
        normalizarNome(
          existente.nome
        );


      campoNome.value =
        "";


      await carregarFila();


      await mostrarAreaReconhecido(
        existente
      );


      botao.disabled =
        false;


      botao.innerText =
        "CONTINUAR";


      return;

    }



    /* =================================================
       PRIMEIRA ENTRADA
       ================================================= */

    nomePendente =
      nome;


    nomeNormalizadoPendente =
      nomeComparacao;


    primeiroCadastroPendente =
      true;


    document
      .getElementById(
        "dadosPrimeiraEntrada"
      )
      .style.display =
      "block";


    campoNome.disabled =
      true;


    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";


    mostrarMensagem(
      "Primeira entrada do dia.\n\nInforme sua Bag e Máquina.",
      "sucesso"
    );


    document
      .getElementById(
        "bag"
      )
      .focus();


  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível verificar.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "CONTINUAR";

  }

}



/* =====================================================
   PRIMEIRA ENTRADA
   ===================================================== */

async function cadastrarPrimeiraEntrada() {

  limparMensagem();


  const campoBag =
    document.getElementById(
      "bag"
    );


  const campoMaquina =
    document.getElementById(
      "maquina"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  const bag =
    campoBag.value.trim();


  const maquina =
    campoMaquina.value.trim();


  if (!bag) {

    mostrarMensagem(
      "Informe o número da Bag.",
      "erro"
    );


    campoBag.focus();

    return;

  }


  if (!maquina) {

    mostrarMensagem(
      "Informe o número da Máquina.",
      "erro"
    );


    campoMaquina.focus();

    return;

  }


  botao.disabled =
    true;


  botao.innerText =
    "ENTRANDO...";


  try {


    /*
      SEGUNDA VERIFICAÇÃO
      CONTRA DUPLICIDADE.
    */

    const verificacao =
      await supabaseClient
        .from("motoboys")
        .select("*");


    if (
      verificacao.error
    ) {

      throw verificacao.error;

    }


    const duplicado =
      (
        verificacao.data ||
        []
      )
      .find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeNormalizadoPendente
      );


    if (
      duplicado
    ) {


      salvarIdentificacao(
        duplicado
      );


      motoboyReconhecido =
        duplicado;


      ultimoNomeNormalizado =
        normalizarNome(
          duplicado.nome
        );


      limparFormulario();


      await carregarFila();


      await mostrarAreaReconhecido(
        duplicado
      );


      return;

    }



    /* =================================================
       ÚLTIMA POSIÇÃO
       ================================================= */

    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select(
          "posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();


    if (
      maiorPosicao.error
    ) {

      throw maiorPosicao.error;

    }


    const ultimaPosicao =
      maiorPosicao.data?.posicao ||
      0;



    /* =================================================
       NOVO REGISTRO
       ================================================= */

    const novo =
      await supabaseClient
        .from("motoboys")
        .insert({

          nome:
            nomePendente,

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1,

          primeira_chegada:
            new Date()
              .toISOString(),

          bag:
            bag,

          maquina:
            maquina,

          fechado:
            false

        })
        .select()
        .single();


    if (
      novo.error
    ) {

      throw novo.error;

    }


    salvarIdentificacao(
      novo.data
    );


    motoboyReconhecido =
      novo.data;


    ultimoNomeNormalizado =
      normalizarNome(
        novo.data.nome
      );


    limparFormulario();


    await carregarFila();


    await mostrarAreaReconhecido(
      novo.data
    );


    mostrarMensagem(
      "✅ Entrada registrada com sucesso!",
      "sucesso"
    );


  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível entrar na fila.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";

  }

}



/* =====================================================
   RETORNAR À FILA

   SERVE PARA:
   - em_entrega
   - fora_fila
   - removido

   SEMPRE ENTRA NO FINAL.
   ===================================================== */

async function acaoMotoboyReconhecido() {

  if (
    !motoboyReconhecido
  ) {

    return;

  }


  limparMensagem();


  const botao =
    document.getElementById(
      "botaoAcao"
    );


  botao.disabled =
    true;


  botao.innerText =
    "PROCESSANDO...";


  try {


    const busca =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          motoboyReconhecido.id
        )
        .maybeSingle();


    if (
      busca.error
    ) {

      throw busca.error;

    }


    const moto =
      busca.data;


    if (!moto) {

      limparIdentificacao();

      mostrarAreaEntrada();

      mostrarMensagem(
        "Seu registro não existe mais. Faça uma nova entrada.",
        "erro"
      );

      return;

    }



    /*
      FECHADO NÃO VOLTA.
    */

    if (
      moto.fechado === true
    ) {

      motoboyReconhecido =
        moto;


      await mostrarAreaReconhecido(
        moto
      );


      mostrarMensagem(
        "Seu Grid já foi fechado.",
        "erro"
      );


      return;

    }



    /*
      SE JÁ ESTÁ DISPONÍVEL,
      NÃO FAZ NADA.
    */

    if (
      moto.status ===
      "disponivel"
    ) {

      motoboyReconhecido =
        moto;


      await mostrarAreaReconhecido(
        moto
      );


      return;

    }



    /*
      SOMENTE ESTES STATUS
      PODEM VOLTAR.
    */

    if (
      moto.status !== "em_entrega" &&
      moto.status !== "fora_fila" &&
      moto.status !== "removido"
    ) {

      mostrarMensagem(
        "Não foi possível realizar esta operação.",
        "erro"
      );

      return;

    }



    /* =================================================
       DESCOBRE A ÚLTIMA POSIÇÃO
       ================================================= */

    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select(
          "posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();


    if (
      maiorPosicao.error
    ) {

      throw maiorPosicao.error;

    }


    const ultimaPosicao =
      maiorPosicao.data?.posicao ||
      0;



    /* =================================================
       VOLTA PARA O FINAL
       ================================================= */

    const retorno =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1

        })
        .eq(
          "id",
          moto.id
        )
        .select()
        .single();


    if (
      retorno.error
    ) {

      throw retorno.error;

    }


    motoboyReconhecido =
      retorno.data;


    salvarIdentificacao(
      retorno.data
    );


    await carregarFila();


    await mostrarAreaReconhecido(
      retorno.data
    );


    if (
      moto.status ===
      "fora_fila"
    ) {

      mostrarMensagem(
        "✅ Você voltou para a fila.\n\n" +
        "Você entrou na última posição.",
        "sucesso"
      );

    } else if (
      moto.status ===
      "em_entrega"
    ) {

      mostrarMensagem(
        "✅ Você retornou da entrega e entrou no final da fila.",
        "sucesso"
      );

    } else {

      mostrarMensagem(
        "✅ Você voltou para o final da fila.",
        "sucesso"
      );

    }


  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível realizar a operação.\n\n" +
      erro.message,
      "erro"
    );


  } finally {


    botao.disabled =
      false;

  }

}



/* =====================================================
   LIMPAR FORMULÁRIO
   ===================================================== */

function limparFormulario() {

  document
    .getElementById(
      "nome"
    )
    .value =
    "";


  document
    .getElementById(
      "nome"
    )
    .disabled =
    false;


  document
    .getElementById(
      "bag"
    )
    .value =
    "";


  document
    .getElementById(
      "maquina"
    )
    .value =
    "";


  document
    .getElementById(
      "dadosPrimeiraEntrada"
    )
    .style.display =
    "none";


  primeiroCadastroPendente =
    false;


  nomePendente =
    "";


  nomeNormalizadoPendente =
    "";


  const botao =
    document.getElementById(
      "botao"
    );


  botao.disabled =
    false;


  botao.innerText =
    "CONTINUAR";

}



/* =====================================================
   IDENTIFICAÇÃO SALVA
   ===================================================== */

async function verificarIdentificacaoSalva() {

  const idSalvo =
    localStorage.getItem(
      "motoboy_id"
    );


  if (!idSalvo) {

    mostrarAreaEntrada();

    return;

  }


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          idSalvo
        )
        .maybeSingle();


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const moto =
      resposta.data;


    /*
      ENCERRAR DIA APAGOU REGISTRO.
    */

    if (!moto) {

      limparIdentificacao();

      mostrarAreaEntrada();

      return;

    }


    motoboyReconhecido =
      moto;


    ultimoNomeNormalizado =
      normalizarNome(
        moto.nome
      );


    await mostrarAreaReconhecido(
      moto
    );


  } catch (erro) {


    console.error(
      "Erro ao reconhecer motoboy:",
      erro
    );


    mostrarAreaEntrada();

  }

}



/* =====================================================
   ATUALIZAR RECONHECIDO
   ===================================================== */

async function atualizarMotoboyReconhecido() {

  if (
    !motoboyReconhecido
  ) {

    return;

  }


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          motoboyReconhecido.id
        )
        .maybeSingle();


    if (
      resposta.error
    ) {

      return;

    }


    if (
      !resposta.data
    ) {

      limparIdentificacao();

      mostrarAreaEntrada();

      return;

    }


    motoboyReconhecido =
      resposta.data;


    await mostrarAreaReconhecido(
      resposta.data
    );


  } catch (erro) {

    console.error(
      erro
    );

  }

}

   ENTER

document

  )
  .addEventListener(

      if (
        event.key ===
        "Enter"
      ) {

  );



/* =====================================================
   REALTIME
   ===================================================== */

supabaseClient

  .channel(
    "motoboy-qr-realtime"
  )

  .on(
    "postgres_changes",
    {

      event:
        "*",

      schema:
        "public",

      table:
        "motoboys"

    },

    async function() {

      await carregarFila();

      await atualizarMotoboyReconhecido();

    }

  )

  .subscribe();



/* =====================================================
   ATUALIZAÇÃO DE SEGURANÇA
   ===================================================== */

setInterval(
  async function() {

    await carregarFila();

    await atualizarMotoboyReconhecido();

  },
  3000
);



/* =====================================================
   QUANDO VOLTAR PARA ABA
   ===================================================== */

document.addEventListener(
  "visibilitychange",
  async function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      await carregarFila();

      await atualizarMotoboyReconhecido();

    }

  }
);



window.addEventListener(
  "focus",
  async function() {

    await carregarFila();

    await atualizarMotoboyReconhecido();

  }
);



/* =====================================================
   INICIAR
   ===================================================== */

async function iniciar() {

  document
    .getElementById(
      "areaEntrada"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =
    "none";


  await carregarFila();

  await verificarIdentificacaoSalva();

}


iniciar();
