<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Entrada de Motoboy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family: Arial, sans-serif;

  background: #f3f4f6;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}

.card {

  width: 100%;

  max-width: 420px;

  background: white;

  padding: 35px 25px;

  border-radius: 18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);

  text-align: center;

}

.icone {

  font-size: 55px;

  margin-bottom: 10px;

}

h1 {

  margin: 0 0 10px;

  font-size: 28px;

  color: #111827;

}

.subtitulo {

  color: #6b7280;

  margin-bottom: 30px;

}

input {

  width: 100%;

  padding: 16px;

  font-size: 18px;

  border: 1px solid #d1d5db;

  border-radius: 10px;

  outline: none;

  margin-bottom: 15px;

}

input:focus {

  border-color: #15803d;

}

button {

  width: 100%;

  padding: 16px;

  border: 0;

  border-radius: 10px;

  background: #15803d;

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

button:disabled {

  opacity: .6;

  cursor: not-allowed;

}

#mensagem {

  display: none;

  margin-top: 20px;

  padding: 15px;

  border-radius: 10px;

  font-weight: bold;

}

.sucesso {

  display: block !important;

  background: #dcfce7;

  color: #166534;

}

.erro {

  display: block !important;

  background: #fee2e2;

  color: #991b1b;

}

</style>

</head>


<body>


<div class="card">

  <div class="icone">
    🛵
  </div>

  <h1>
    Entrada de Motoboy
  </h1>

  <div class="subtitulo">
    Digite seu nome para entrar na fila.
  </div>


  <input
    id="nome"
    type="text"
    placeholder="Seu nome"
    autocomplete="off"
    maxlength="50"
  >


  <button
    id="botao"
    onclick="entrarNaFila()"
  >
    ENTRAR NA FILA
  </button>


  <div id="mensagem"></div>

</div>


<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nmkkabthynytwevadthq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pvTjmMDG1aC7qDyYW3kEZA_WR9-a-E3";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   MENSAGEM
   ===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );

  mensagem.innerText =
    texto;

  mensagem.className =
    tipo;

}


/* =====================================================
   ENTRAR NA FILA
   ===================================================== */

async function entrarNaFila() {

  const campo =
    document.getElementById(
      "nome"
    );

  const botao =
    document.getElementById(
      "botao"
    );


  const nome =
    campo.value.trim();


  if (!nome) {

    mostrarMensagem(
      "Digite seu nome.",
      "erro"
    );

    campo.focus();

    return;

  }


  botao.disabled =
    true;

  botao.innerText =
    "ENTRANDO...";


  try {


    /*
      Verifica se já existe
      um motoboy com esse nome.
    */

    const existente =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .ilike(
          "nome",
          nome
        );


    if (existente.error) {

      throw existente.error;

    }


    const registros =
      existente.data || [];


    /*
      Se já estiver disponível
      ou em entrega, não cria
      outro registro.
    */

    const ativo =
      registros.find(
        moto =>
          moto.status === "disponivel" ||
          moto.status === "em_entrega"
      );


    if (ativo) {

      /*
        Se estiver em entrega,
        significa que ele retornou.

        Ele volta para o final da fila.
      */

      if (
        ativo.status ===
        "em_entrega"
      ) {


        const maiorPosicao =
          await supabaseClient
            .from("motoboys")
            .select("posicao")
            .eq(
              "status",
              "disponivel"
            )
            .order(
              "posicao",
              {
                ascending: false
              }
            )
            .limit(1)
            .maybeSingle();


        if (
          maiorPosicao.error
        ) {

          throw maiorPosicao.error;

        }


        const ultimaPosicao =
          maiorPosicao.data?.posicao ||
          0;


        const retorno =
          await supabaseClient
            .from("motoboys")
            .update({

              status:
                "disponivel",

              posicao:
                ultimaPosicao + 1

            })
            .eq(
              "id",
              ativo.id
            );


        if (retorno.error) {

          throw retorno.error;

        }


        mostrarMensagem(
          "🔄 " +
          nome +
          " retornou e entrou no final da fila!",
          "sucesso"
        );


      } else {

        mostrarMensagem(
          "⚠️ " +
          nome +
          " já está na fila.",
          "erro"
        );

      }


      campo.value =
        "";

      botao.disabled =
        false;

      botao.innerText =
        "ENTRAR NA FILA";

      return;

    }


    /*
      Primeira chegada.
    */

    const agora =
      new Date().toISOString();


    /*
      Descobre a última posição.
    */

    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select("posicao")
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();


    if (maiorPosicao.error) {

      throw maiorPosicao.error;

    }


    const ultimaPosicao =
      maiorPosicao.data?.posicao ||
      0;


    /*
      Cria o motoboy.
    */

    const novo =
      await supabaseClient
        .from("motoboys")
        .insert({

          nome:
            nome,

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1,

          primeira_chegada:
            agora

        })
        .select()
        .single();


    if (novo.error) {

      throw novo.error;

    }


    mostrarMensagem(
      "✅ " +
      nome +
      " entrou na fila!\n\n" +
      "Aguarde ser chamado pela loja.",
      "sucesso"
    );


    campo.value =
      "";


  } catch (erro) {

    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível entrar na fila.\n\n" +
      erro.message,
      "erro"
    );

  }


  botao.disabled =
    false;

  botao.innerText =
    "ENTRAR NA FILA";

}


/* =====================================================
   ENTER NO TECLADO
   ===================================================== */

document
  .getElementById("nome")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        entrarNaFila();

      }

    }
  );


</script>

</body>

</html>
