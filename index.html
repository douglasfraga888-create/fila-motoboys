<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nmkkabthynytwevadthq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pvTjmMDG1aC7qDyYW3kEZA_WR9-a-E3";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   VARIÁVEIS
   ===================================================== */

let primeiroCadastroPendente =
  false;


let nomePendente =
  "";


let nomeNormalizadoPendente =
  "";


let ultimoNomeNormalizado =
  "";


let motoboyReconhecido =
  null;


let registroServiceWorker =
  null;



/* =====================================================
   NORMALIZAR NOME
   ===================================================== */

function normalizarNome(
  nome
) {

  return String(
    nome || ""
  )

  .trim()

  .replace(
    /\s+/g,
    " "
  )

  .normalize(
    "NFD"
  )

  .replace(
    /[\u0300-\u036f]/g,
    ""
  )

  .toLowerCase();

}



/* =====================================================
   FORMATAR NOME
   ===================================================== */

function formatarNome(
  nome
) {

  return String(
    nome || ""
  )

  .trim()

  .replace(
    /\s+/g,
    " "
  );

}



/* =====================================================
   SEGURANÇA HTML
   ===================================================== */

function esc(
  texto
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    texto || "";


  return div.innerHTML;

}



/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    texto;


  mensagem.className =
    tipo;

}



function limparMensagem() {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.innerText =
    "";


  mensagem.className =
    "";

}



/* =====================================================
   SERVICE WORKER
   ===================================================== */

async function registrarServiceWorker() {


  if (
    !(
      "serviceWorker"
      in navigator
    )
  ) {


    console.log(
      "Service Worker não suportado."
    );


    return null;

  }


  try {


    registroServiceWorker =
      await navigator
        .serviceWorker
        .register(
          "/sw.js"
        );


    console.log(
      "Service Worker registrado:",
      registroServiceWorker
    );


    return registroServiceWorker;


  } catch (erro) {


    console.error(
      "Erro ao registrar Service Worker:",
      erro
    );


    return null;

  }

}



/* =====================================================
   PREPARAR ÁREA DE NOTIFICAÇÃO
   ===================================================== */

async function atualizarAreaNotificacoes() {


  const area =
    document.getElementById(
      "areaNotificacoes"
    );


  const ativar =
    document.getElementById(
      "botaoAtivarNotificacao"
    );


  const testar =
    document.getElementById(
      "botaoTestarNotificacao"
    );


  const status =
    document.getElementById(
      "statusNotificacao"
    );



  if (
    !(
      "Notification"
      in window
    )
  ) {


    area.style.display =
      "none";


    return;

  }



  area.style.display =
    "block";



  if (
    Notification.permission ===
    "granted"
  ) {


    ativar.style.display =
      "none";


    testar.style.display =
      "block";


    status.innerText =
      "✅ Notificações ativadas.";


    return;

  }



  if (
    Notification.permission ===
    "denied"
  ) {


    ativar.style.display =
      "none";


    testar.style.display =
      "none";


    status.innerText =
      "🚫 As notificações estão bloqueadas neste navegador.";


    return;

  }



  ativar.style.display =
    "block";


  testar.style.display =
    "none";


  status.innerText =
    "Notificações ainda não ativadas.";

}



/* =====================================================
   ATIVAR NOTIFICAÇÕES

   O pedido é feito após o clique
   do motoboy.
   ===================================================== */

async function ativarNotificacoes() {


  if (
    !(
      "Notification"
      in window
    )
  ) {


    alert(
      "Este navegador não suporta notificações."
    );


    return;

  }



  try {


    if (
      !registroServiceWorker
    ) {


      registroServiceWorker =
        await registrarServiceWorker();

    }



    const permissao =
      await Notification
        .requestPermission();



    if (
      permissao ===
      "granted"
    ) {


      localStorage.setItem(
        "notificacoes_ativas",
        "sim"
      );


      await atualizarAreaNotificacoes();


      /*
        Já envia uma notificação
        para confirmar que funcionou.
      */

      await testarNotificacao();


    } else {


      localStorage.removeItem(
        "notificacoes_ativas"
      );


      await atualizarAreaNotificacoes();

    }



  } catch (erro) {


    console.error(
      erro
    );


    alert(
      "Não foi possível ativar as notificações."
    );

  }

}



/* =====================================================
   TESTAR NOTIFICAÇÃO
   ===================================================== */

async function testarNotificacao() {


  if (
    Notification.permission !==
    "granted"
  ) {


    alert(
      "Primeiro permita as notificações."
    );


    return;

  }



  try {


    if (
      !registroServiceWorker
    ) {


      registroServiceWorker =
        await navigator
          .serviceWorker
          .ready;

    }



    let nome =
      "Motoboy";


    if (
      motoboyReconhecido
    ) {


      nome =
        motoboyReconhecido.nome;

    }



    await registroServiceWorker
      .showNotification(

        "🛵 Pizzaria Di Roma",

        {

          body:
            nome +
            ", notificações ativadas com sucesso!",

          vibrate:
            [
              200,
              100,
              200
            ],

          data: {

            url:
              "/"

          }

        }

      );



  } catch (erro) {


    console.error(
      "Erro na notificação:",
      erro
    );


    alert(
      "Não foi possível mostrar a notificação."
    );

  }

}



/* =====================================================
   IDENTIFICAÇÃO LOCAL
   ===================================================== */

function salvarIdentificacao(
  moto
) {


  localStorage.setItem(
    "motoboy_id",
    String(moto.id)
  );


  localStorage.setItem(
    "motoboy_nome",
    moto.nome
  );

}



function limparIdentificacao() {


  localStorage.removeItem(
    "motoboy_id"
  );


  localStorage.removeItem(
    "motoboy_nome"
  );


  motoboyReconhecido =
    null;


  ultimoNomeNormalizado =
    "";

}



/* =====================================================
   MOSTRAR ÁREA DE ENTRADA
   ===================================================== */

function mostrarAreaEntrada() {


  document
    .getElementById(
      "areaEntrada"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =
    "none";

}



/* =====================================================
   MOSTRAR MOTOBOY RECONHECIDO
   ===================================================== */

async function mostrarAreaReconhecido(
  moto
) {


  document
    .getElementById(
      "areaEntrada"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =
    "block";


  const nome =
    document.getElementById(
      "nomeReconhecido"
    );


  const status =
    document.getElementById(
      "statusReconhecido"
    );


  const botao =
    document.getElementById(
      "botaoRetorno"
    );



  if (
    moto.status ===
    "em_entrega"
  ) {


    nome.innerText =
      "🛵 " +
      moto.nome;


    status.className =
      "status-reconhecido status-entrega";


    status.innerText =
      "Você está em entrega.";


    botao.style.display =
      "block";


    botao.innerText =
      moto.nome +
      ", RETORNAR À FILA";


  } else if (
    moto.status ===
    "disponivel"
  ) {


    const posicao =
      await descobrirPosicaoPorId(
        moto.id
      );


    nome.innerText =
      "✅ " +
      moto.nome;


    status.className =
      "status-reconhecido status-disponivel";


    status.innerText =
      "Você já está na fila." +
      (
        posicao
          ?
          "\n\nSua posição atual: " +
          posicao +
          "º"
          :
          ""
      );


    botao.style.display =
      "none";

  }



  await atualizarAreaNotificacoes();

}



/* =====================================================
   NÃO SOU ESTE MOTOBOY
   ===================================================== */

function naoSouEsteMotoboy() {


  const confirmar =
    confirm(
      "Deseja remover a identificação deste aparelho?"
    );


  if (!confirmar) {

    return;

  }


  limparIdentificacao();


  limparFormulario();


  mostrarAreaEntrada();


  limparMensagem();

}



/* =====================================================
   CARREGAR FILA
   ===================================================== */

async function carregarFila() {


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,nome,status,posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending:
              true
          }
        );


    if (
      resposta.error
    ) {


      throw resposta.error;

    }


    const fila =
      resposta.data || [];


    const elemento =
      document.getElementById(
        "fila"
      );


    document
      .getElementById(
        "contadorFila"
      )
      .innerText =
      fila.length;



    if (
      fila.length === 0
    ) {


      elemento.innerHTML =
        '<div class="vazio">' +
        'Nenhum motoboy disponível no momento.' +
        '</div>';


      return;

    }



    elemento.innerHTML =
      "";



    fila.forEach(
      (
        moto,
        index
      ) => {


        const ehUsuarioAtual =
          ultimoNomeNormalizado &&
          normalizarNome(
            moto.nome
          ) ===
          ultimoNomeNormalizado;



        elemento.innerHTML += `

          <div
            class="item-fila
            ${ehUsuarioAtual ? "sua-posicao" : ""}"
          >

            <div class="posicao">

              ${index + 1}º

            </div>


            <div class="nome-fila">

              ${esc(moto.nome)}

              ${
                ehUsuarioAtual
                  ?
                  '<span class="voce">VOCÊ</span>'
                  :
                  ""
              }

            </div>

          </div>

        `;

      }
    );


  } catch (erro) {


    console.error(
      erro
    );

  }

}



/* =====================================================
   POSIÇÃO
   ===================================================== */

async function descobrirPosicaoPorId(
  id
) {


  const resposta =
    await supabaseClient
      .from("motoboys")
      .select(
        "id,posicao"
      )
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending:
            true
        }
      );


  if (
    resposta.error
  ) {


    throw resposta.error;

  }


  const fila =
    resposta.data || [];


  const indice =
    fila.findIndex(
      moto =>
        String(moto.id) ===
        String(id)
    );


  if (
    indice === -1
  ) {


    return null;

  }


  return indice + 1;

}



/* =====================================================
   AÇÃO PRINCIPAL
   ===================================================== */

async function acaoPrincipal() {


  if (
    primeiroCadastroPendente
  ) {


    await cadastrarPrimeiraEntrada();


  } else {


    await verificarMotoboy();

  }

}



/* =====================================================
   VERIFICAR MOTOBOY
   ===================================================== */

async function verificarMotoboy() {


  limparMensagem();


  const campoNome =
    document.getElementById(
      "nome"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  const nome =
    formatarNome(
      campoNome.value
    );


  const nomeComparacao =
    normalizarNome(
      nome
    );



  if (!nome) {


    mostrarMensagem(
      "Digite seu nome.",
      "erro"
    );


    return;

  }



  botao.disabled =
    true;


  botao.innerText =
    "VERIFICANDO...";



  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .in(
          "status",
          [
            "disponivel",
            "em_entrega"
          ]
        );


    if (
      resposta.error
    ) {


      throw resposta.error;

    }



    const ativo =
      (
        resposta.data ||
        []
      )
      .find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeComparacao
      );



    if (
      ativo
    ) {


      salvarIdentificacao(
        ativo
      );


      motoboyReconhecido =
        ativo;


      ultimoNomeNormalizado =
        normalizarNome(
          ativo.nome
        );


      campoNome.value =
        "";


      await carregarFila();


      await mostrarAreaReconhecido(
        ativo
      );


      botao.disabled =
        false;


      botao.innerText =
        "CONTINUAR";


      return;

    }



    nomePendente =
      nome;


    nomeNormalizadoPendente =
      nomeComparacao;


    primeiroCadastroPendente =
      true;


    document
      .getElementById(
        "dadosPrimeiraEntrada"
      )
      .style.display =
      "block";


    campoNome.disabled =
      true;


    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";


    mostrarMensagem(
      "Primeira entrada do dia.\n\nInforme sua Bag e Máquina.",
      "sucesso"
    );


    document
      .getElementById(
        "bag"
      )
      .focus();



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível verificar.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "CONTINUAR";

  }

}



/* =====================================================
   PRIMEIRA ENTRADA
   ===================================================== */

async function cadastrarPrimeiraEntrada() {


  limparMensagem();


  const campoBag =
    document.getElementById(
      "bag"
    );


  const campoMaquina =
    document.getElementById(
      "maquina"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  const bag =
    campoBag.value.trim();


  const maquina =
    campoMaquina.value.trim();



  if (!bag) {


    mostrarMensagem(
      "Informe o número da Bag.",
      "erro"
    );


    campoBag.focus();


    return;

  }



  if (!maquina) {


    mostrarMensagem(
      "Informe o número da Máquina.",
      "erro"
    );


    campoMaquina.focus();


    return;

  }



  botao.disabled =
    true;


  botao.innerText =
    "ENTRANDO...";



  try {


    const verificacao =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .in(
          "status",
          [
            "disponivel",
            "em_entrega"
          ]
        );


    if (
      verificacao.error
    ) {


      throw verificacao.error;

    }



    const duplicado =
      (
        verificacao.data ||
        []
      )
      .find(
        moto =>
          normalizarNome(
            moto.nome
          ) ===
          nomeNormalizadoPendente
      );



    if (
      duplicado
    ) {


      salvarIdentificacao(
        duplicado
      );


      motoboyReconhecido =
        duplicado;


      ultimoNomeNormalizado =
        normalizarNome(
          duplicado.nome
        );


      limparFormulario();


      await carregarFila();


      await mostrarAreaReconhecido(
        duplicado
      );


      return;

    }



    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select(
          "posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending:
              false
          }
        )
        .limit(1)
        .maybeSingle();



    if (
      maiorPosicao.error
    ) {


      throw maiorPosicao.error;

    }



    const ultimaPosicao =
      maiorPosicao.data
        ?.posicao ||
      0;



    const novo =
      await supabaseClient
        .from("motoboys")
        .insert({

          nome:
            nomePendente,

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1,

          primeira_chegada:
            new Date()
              .toISOString(),

          bag:
            bag,

          maquina:
            maquina

        })
        .select()
        .single();



    if (
      novo.error
    ) {


      throw novo.error;

    }



    salvarIdentificacao(
      novo.data
    );


    motoboyReconhecido =
      novo.data;


    ultimoNomeNormalizado =
      normalizarNome(
        novo.data.nome
      );


    limparFormulario();


    await carregarFila();


    await mostrarAreaReconhecido(
      novo.data
    );


    mostrarMensagem(
      "✅ Entrada registrada com sucesso!",
      "sucesso"
    );



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível entrar na fila.\n\n" +
      erro.message,
      "erro"
    );


    botao.disabled =
      false;


    botao.innerText =
      "ENTRAR NA FILA";

  }

}



/* =====================================================
   RETORNAR À FILA
   ===================================================== */

async function retornarMotoboyReconhecido() {


  if (
    !motoboyReconhecido
  ) {


    return;

  }


  limparMensagem();


  const botao =
    document.getElementById(
      "botaoRetorno"
    );


  botao.disabled =
    true;


  botao.innerText =
    "RETORNANDO...";



  try {


    const busca =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          motoboyReconhecido.id
        )
        .maybeSingle();



    if (
      busca.error
    ) {


      throw busca.error;

    }



    const moto =
      busca.data;



    if (!moto) {


      limparIdentificacao();


      mostrarAreaEntrada();


      return;

    }



    if (
      moto.status ===
      "disponivel"
    ) {


      motoboyReconhecido =
        moto;


      await mostrarAreaReconhecido(
        moto
      );


      return;

    }



    const maiorPosicao =
      await supabaseClient
        .from("motoboys")
        .select(
          "posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending:
              false
          }
        )
        .limit(1)
        .maybeSingle();



    if (
      maiorPosicao.error
    ) {


      throw maiorPosicao.error;

    }



    const ultimaPosicao =
      maiorPosicao.data
        ?.posicao ||
      0;



    const retorno =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1

        })
        .eq(
          "id",
          moto.id
        )
        .select()
        .single();



    if (
      retorno.error
    ) {


      throw retorno.error;

    }



    motoboyReconhecido =
      retorno.data;


    salvarIdentificacao(
      retorno.data
    );


    await carregarFila();


    await mostrarAreaReconhecido(
      retorno.data
    );


    mostrarMensagem(
      "🔄 Retorno realizado!\n\nVocê entrou no final da fila.",
      "sucesso"
    );



  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Não foi possível retornar à fila.\n\n" +
      erro.message,
      "erro"
    );


  } finally {


    botao.disabled =
      false;

  }

}



/* =====================================================
   LIMPAR FORMULÁRIO
   ===================================================== */

function limparFormulario() {


  document
    .getElementById(
      "nome"
    )
    .value =
    "";


  document
    .getElementById(
      "nome"
    )
    .disabled =
    false;


  document
    .getElementById(
      "bag"
    )
    .value =
    "";


  document
    .getElementById(
      "maquina"
    )
    .value =
    "";


  document
    .getElementById(
      "dadosPrimeiraEntrada"
    )
    .style.display =
    "none";


  primeiroCadastroPendente =
    false;


  nomePendente =
    "";


  nomeNormalizadoPendente =
    "";


  const botao =
    document.getElementById(
      "botao"
    );


  botao.disabled =
    false;


  botao.innerText =
    "CONTINUAR";

}



/* =====================================================
   IDENTIFICAÇÃO SALVA
   ===================================================== */

async function verificarIdentificacaoSalva() {


  const idSalvo =
    localStorage.getItem(
      "motoboy_id"
    );


  if (!idSalvo) {


    mostrarAreaEntrada();


    return;

  }



  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          idSalvo
        )
        .maybeSingle();



    if (
      resposta.error
    ) {


      throw resposta.error;

    }



    const moto =
      resposta.data;



    if (!moto) {


      limparIdentificacao();


      mostrarAreaEntrada();


      return;

    }



    motoboyReconhecido =
      moto;


    ultimoNomeNormalizado =
      normalizarNome(
        moto.nome
      );


    await mostrarAreaReconhecido(
      moto
    );



  } catch (erro) {


    console.error(
      erro
    );


    mostrarAreaEntrada();

  }

}



/* =====================================================
   ATUALIZAR MOTOBOY RECONHECIDO
   ===================================================== */

async function atualizarMotoboyReconhecido() {


  if (
    !motoboyReconhecido
  ) {


    return;

  }



  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          motoboyReconhecido.id
        )
        .maybeSingle();



    if (
      resposta.error
    ) {


      return;

    }



    if (
      !resposta.data
    ) {


      limparIdentificacao();


      mostrarAreaEntrada();


      return;

    }



    motoboyReconhecido =
      resposta.data;


    await mostrarAreaReconhecido(
      resposta.data
    );



  } catch (erro) {


    console.error(
      erro
    );

  }

}

/* =====================================================
   REALTIME
   ===================================================== */

supabaseClient

  .channel(
    "motoboy-qr-realtime"
  )

  .on(
    "postgres_changes",
    {

      event:
        "*",

      schema:
        "public",

      table:

      await carregarFila();


      await atualizarMotoboyReconhecido();

    }

  )

  .subscribe();



/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
   ===================================================== */

setInterval(

    await carregarFila();


    await atualizarMotoboyReconhecido();


  },
  3000
);

   VOLTAR PARA ABA
   ===================================================== */

document.addEventListener(

    if (

    ) {

);

async function iniciar() {


  document
    .getElementById(
      "areaEntrada"
    )

  document
    .getElementById(
      "areaReconhecido"
    )
    .style.display =

  */

  await registrarServiceWorker();

    Carrega a fila.
  */

  await carregarFila();


  /*
    Verifica quem é o motoboy.
  */

  await verificarIdentificacaoSalva();

}


iniciar();
