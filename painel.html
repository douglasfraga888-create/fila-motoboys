<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Controle Motoboys Pizzaria Di Roma</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

#relogio {
  font-size: 18px;
  font-weight: bold;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.grid-principal {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

.contador {
  background: #e5e7eb;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 13px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 5px;
  border-bottom: 1px solid #e5e7eb;
  gap: 10px;
}

.esquerda {
  display: flex;
  align-items: center;
}

.posicao {
  width: 50px;
  font-size: 22px;
  font-weight: bold;
}

.nome {
  font-size: 18px;
  font-weight: bold;
}

.info {
  margin-top: 4px;
  color: #6b7280;
  font-size: 13px;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  background: #dcfce7;
  color: #166534;
  white-space: nowrap;
}

.status.entrega {
  background: #fef3c7;
  color: #92400e;
}

.vazio {
  color: #6b7280;
  padding: 15px 0;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}


/* =====================================================
   BOTÕES PRINCIPAIS
   ===================================================== */

.chamar {
  width: 100%;
  background: #15803d;
  color: white;
}

.atualizar {
  width: 100%;
  background: #2563eb;
  color: white;
}

.encerrar {
  width: 100%;
  background: #b91c1c;
  color: white;
}


/* =====================================================
   MENSAGENS
   ===================================================== */

#mensagem {
  display: none;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-weight: bold;
}

#mensagem.sucesso {
  display: block;
  background: #dcfce7;
  color: #166534;
}

#mensagem.erro {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}


/* =====================================================
   CHAMADO
   ===================================================== */

#chamado {
  display: none;
  background: #dcfce7;
  color: #166534;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}


/* =====================================================
   CONTROLES DA FILA
   ===================================================== */

.direita-fila {
  display: flex;
  align-items: center;
  gap: 10px;
}

.acoes-fila {
  display: flex;
  gap: 5px;
}

.acoes-fila button {
  padding: 8px 10px;
  font-size: 14px;
  border-radius: 8px;
}

.botao-subir,
.botao-descer {
  background: #374151;
  color: white;
}

.botao-excluir {
  background: #b91c1c;
  color: white;
}


/* =====================================================
   CONTROLES EM ENTREGA
   ===================================================== */

.direita-entrega {
  display: flex;
  align-items: center;
  gap: 10px;
}

.acoes-entrega {
  display: flex;
  gap: 5px;
}

.acoes-entrega button {
  padding: 8px 10px;
  font-size: 14px;
  border-radius: 8px;
}

.botao-retornar-manual {
  background: #2563eb;
  color: white;
}


/* =====================================================
   GRID
   ===================================================== */

.grid-cabecalho {
  display: grid;
  grid-template-columns:
    2fr
    1fr
    1fr
    1fr
    1fr;
  gap: 10px;
  padding: 10px;
  background: #111827;
  color: white;
  border-radius: 10px;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
}

.grid-item {
  display: grid;
  grid-template-columns:
    2fr
    1fr
    1fr
    1fr
    1fr;
  gap: 10px;
  align-items: center;
  padding: 12px 10px;
  border-bottom: 1px solid #e5e7eb;
}

.grid-nome {
  font-weight: bold;
}

.grid-horario {
  color: #6b7280;
}

.grid-entregas {
  text-align: center;
  font-weight: bold;
  color: #1d4ed8;
}

.campo-grid {
  width: 100%;
  padding: 9px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

.campo-grid:focus {
  outline: none;
  border-color: #2563eb;
}

.salvo {
  border-color: #15803d;
  background: #f0fdf4;
}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width: 750px) {

  .grid-principal {
    grid-template-columns: 1fr;
  }

  header {
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }

}

@media (max-width: 650px) {

  .item-fila,
  .item-entrega {
    align-items: flex-start;
    flex-direction: column;
  }

  .direita-fila,
  .direita-entrega {
    width: 100%;
    justify-content: space-between;
  }

  .grid-cabecalho {
    display: none;
  }

  .grid-item {
    grid-template-columns: 1fr 1fr;
    background: #f9fafb;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid #e5e7eb;
  }

  .grid-nome {
    grid-column: 1 / 3;
    font-size: 17px;
  }

}

</style>

</head>


<body>


<header>

  <h1>
    🛵 Controle Motoboys Pizzaria Di Roma
  </h1>

  <div id="relogio">
    --:--
  </div>

</header>


<div class="container">


  <div id="mensagem"></div>

  <div id="chamado"></div>


  <div class="grid-principal">


    <div class="card">

      <h2>

        🟢 Disponíveis

        <span
          id="contadorFila"
          class="contador"
        >
          0
        </span>

      </h2>

      <div id="fila">
        Carregando...
      </div>

    </div>


    <div class="card">

      <h2>

        🛵 Em entrega

        <span
          id="contadorEntrega"
          class="contador"
        >
          0
        </span>

      </h2>

      <div id="entregas">
        Carregando...
      </div>

    </div>


  </div>


  <div class="card">

    <h2>
      🚀 Controle da loja
    </h2>


    <button
      class="chamar"
      onclick="chamarProximo()"
    >
      CHAMAR PRÓXIMO
    </button>


    <br><br>


    <button
      class="atualizar"
      onclick="atualizarListaManual()"
    >
      🔄 ATUALIZAR LISTA
    </button>


    <br><br>


    <button
      class="encerrar"
      onclick="encerrarDia()"
    >
      🌙 ENCERRAR DIA
    </button>

  </div>


  <div class="card">

    <h2>
      Grid
    </h2>


    <div class="grid-cabecalho">

      <div>
        Motoboy
      </div>

      <div>
        Chegada
      </div>

      <div>
        Nº Bag
      </div>

      <div>
        Máquina
      </div>

      <div>
        Entregas
      </div>

    </div>


    <div id="historico">
      Carregando...
    </div>

  </div>


</div>



<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nmkkabthynytwevadthq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pvTjmMDG1aC7qDyYW3kEZA_WR9-a-E3";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let carregandoDados =
  false;



/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      "mensagem"
    );


  elemento.innerText =
    texto;


  elemento.className =
    tipo;

}


function esconderMensagem() {

  const elemento =
    document.getElementById(
      "mensagem"
    );


  elemento.innerText =
    "";


  elemento.className =
    "";

}



/* =====================================================
   RELÓGIO
   ===================================================== */

function atualizarRelogio() {

  const agora =
    new Date();


  document
    .getElementById(
      "relogio"
    )
    .innerText =
    agora.toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

}


setInterval(
  atualizarRelogio,
  1000
);


atualizarRelogio();



/* =====================================================
   SEGURANÇA HTML
   ===================================================== */

function esc(
  texto
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    texto ?? "";


  return div.innerHTML;

}



/* =====================================================
   CARREGAR DADOS
   ===================================================== */

async function carregarDados() {

  if (
    carregandoDados
  ) {

    return;

  }


  carregandoDados =
    true;


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*");


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const todos =
      resposta.data || [];


    const fila =
      todos

        .filter(
          moto =>
            moto.status ===
            "disponivel"
        )

        .sort(
          (a,b) =>
            (a.posicao || 999999) -
            (b.posicao || 999999)
        );


    const entregas =
      todos

        .filter(
          moto =>
            moto.status ===
            "em_entrega"
        );


    mostrarFila(
      fila
    );


    mostrarEntregas(
      entregas
    );


    mostrarGrid(
      todos
    );


  } catch (erro) {


    console.error(
      erro
    );


    mostrarMensagem(
      "Erro ao carregar o sistema: " +
      erro.message,
      "erro"
    );


  } finally {


    carregandoDados =
      false;

  }

}



/* =====================================================
   FILA
   ===================================================== */

function mostrarFila(
  fila
) {

  const elemento =
    document.getElementById(
      "fila"
    );


  elemento.innerHTML =
    "";


  document
    .getElementById(
      "contadorFila"
    )
    .innerText =
    fila.length;


  if (
    fila.length === 0
  ) {

    elemento.innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy disponível.' +
      '</div>';


    return;

  }


  fila.forEach(
    (
      moto,
      index
    ) => {


      const horario =
        moto.primeira_chegada

          ?

          new Date(
            moto.primeira_chegada
          )
          .toLocaleTimeString(
            "pt-BR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )

          :

          "--:--";


      const podeSubir =
        index > 0;


      const podeDescer =
        index <
        fila.length - 1;


      elemento.innerHTML += `

        <div class="item item-fila">

          <div class="esquerda">

            <div class="posicao">
              ${index + 1}º
            </div>

            <div>

              <div class="nome">
                ${esc(moto.nome)}
              </div>

              <div class="info">
                Primeira chegada:
                ${horario}
              </div>

            </div>

          </div>


          <div class="direita-fila">


            <div class="status">
              Disponível
            </div>


            <div class="acoes-fila">


              <button
                class="botao-subir"
                ${podeSubir ? "" : "disabled"}
                onclick="moverNaFila('${moto.id}', -1)"
              >
                ▲
              </button>


              <button
                class="botao-descer"
                ${podeDescer ? "" : "disabled"}
                onclick="moverNaFila('${moto.id}', 1)"
              >
                ▼
              </button>


              <button
                class="botao-excluir"
                onclick="excluirDaFila('${moto.id}')"
              >
                🗑️
              </button>


            </div>

          </div>

        </div>

      `;


    }
  );

}



/* =====================================================
   EM ENTREGA
   ===================================================== */

function mostrarEntregas(
  entregas
) {

  const elemento =
    document.getElementById(
      "entregas"
    );


  elemento.innerHTML =
    "";


  document
    .getElementById(
      "contadorEntrega"
    )
    .innerText =
    entregas.length;


  if (
    entregas.length === 0
  ) {

    elemento.innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy em entrega.' +
      '</div>';


    return;

  }


  entregas.forEach(
    moto => {


      const horario =
        moto.primeira_chegada

          ?

          new Date(
            moto.primeira_chegada
          )
          .toLocaleTimeString(
            "pt-BR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )

          :

          "--:--";


      elemento.innerHTML += `

        <div class="item item-entrega">


          <div>

            <div class="nome">
              🛵 ${esc(moto.nome)}
            </div>

            <div class="info">
              Primeira chegada:
              ${horario}
            </div>

          </div>


          <div class="direita-entrega">


            <div class="status entrega">
              Em entrega
            </div>


            <div class="acoes-entrega">


              <button
                class="botao-retornar-manual"
                onclick="retornarEntregaManual('${moto.id}')"
              >
                ↩
              </button>


              <button
                class="botao-excluir"
                onclick="excluirEmEntrega('${moto.id}')"
              >
                🗑️
              </button>


            </div>


          </div>


        </div>

      `;


    }
  );

}



/* =====================================================
   GRID
   ===================================================== */

function mostrarGrid(
  motoboys
) {

  const elemento =
    document.getElementById(
      "historico"
    );


  elemento.innerHTML =
    "";


  const lista =
    [...motoboys]

      .filter(
        moto =>
          moto.primeira_chegada
      )

      .sort(
        (a,b) =>
          new Date(
            a.primeira_chegada
          ) -
          new Date(
            b.primeira_chegada
          )
      );


  if (
    lista.length === 0
  ) {

    elemento.innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy registrado hoje.' +
      '</div>';


    return;

  }


  lista.forEach(
    moto => {


      const horario =
        new Date(
          moto.primeira_chegada
        )
        .toLocaleTimeString(
          "pt-BR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      elemento.innerHTML += `

        <div class="grid-item">


          <div class="grid-nome">

            ${esc(moto.nome)}

          </div>


          <div class="grid-horario">

            🕐 ${horario}

          </div>


          <div>

            <input
              class="campo-grid"
              id="bag-${moto.id}"
              type="text"
              value="${esc(moto.bag || "")}"
              placeholder="Bag"
              maxlength="20"
              onchange="salvarBagMaquina('${moto.id}')"
            >

          </div>


          <div>

            <input
              class="campo-grid"
              id="maquina-${moto.id}"
              type="text"
              value="${esc(moto.maquina || "")}"
              placeholder="Máquina"
              maxlength="20"
              onchange="salvarBagMaquina('${moto.id}')"
            >

          </div>


          <div class="grid-entregas">

            ${moto.entregas_dia || 0}

          </div>


        </div>

      `;


    }
  );

}



/* =====================================================
   SALVAR BAG / MÁQUINA
   ===================================================== */

async function salvarBagMaquina(
  id
) {

  const campoBag =
    document.getElementById(
      "bag-" + id
    );


  const campoMaquina =
    document.getElementById(
      "maquina-" + id
    );


  if (
    !campoBag ||
    !campoMaquina
  ) {

    return;

  }


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .update({

          bag:
            campoBag.value.trim(),

          maquina:
            campoMaquina.value.trim()

        })
        .eq(
          "id",
          id
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    campoBag.classList.add(
      "salvo"
    );


    campoMaquina.classList.add(
      "salvo"
    );


    setTimeout(
      function() {

        campoBag.classList.remove(
          "salvo"
        );


        campoMaquina.classList.remove(
          "salvo"
        );

      },
      1000
    );


  } catch (erro) {


    mostrarMensagem(
      "Erro ao salvar Bag/Máquina: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   REORGANIZAR FILA
   ===================================================== */

async function reorganizarFila() {

  const resposta =
    await supabaseClient
      .from("motoboys")
      .select(
        "id,posicao"
      )
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending: true
        }
      );


  if (
    resposta.error
  ) {

    throw resposta.error;

  }


  const fila =
    resposta.data || [];


  for (
    let i = 0;
    i < fila.length;
    i++
  ) {

    const novaPosicao =
      i + 1;


    if (
      fila[i].posicao !==
      novaPosicao
    ) {

      const atualizacao =
        await supabaseClient
          .from("motoboys")
          .update({

            posicao:
              novaPosicao

          })
          .eq(
            "id",
            fila[i].id
          );


      if (
        atualizacao.error
      ) {

        throw atualizacao.error;

      }

    }

  }

}



/* =====================================================
   MOVER NA FILA
   ===================================================== */

async function moverNaFila(
  id,
  direcao
) {

  try {


    await reorganizarFila();


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const fila =
      resposta.data || [];


    const indice =
      fila.findIndex(
        moto =>
          String(moto.id) ===
          String(id)
      );


    if (
      indice === -1
    ) {

      return;

    }


    const destino =
      indice +
      direcao;


    if (
      destino < 0 ||
      destino >= fila.length
    ) {

      return;

    }


    const atual =
      fila[indice];


    const outro =
      fila[destino];


    const p1 =
      await supabaseClient
        .from("motoboys")
        .update({
          posicao: -999999
        })
        .eq(
          "id",
          atual.id
        );


    if (
      p1.error
    ) {

      throw p1.error;

    }


    const p2 =
      await supabaseClient
        .from("motoboys")
        .update({
          posicao:
            atual.posicao
        })
        .eq(
          "id",
          outro.id
        );


    if (
      p2.error
    ) {

      throw p2.error;

    }


    const p3 =
      await supabaseClient
        .from("motoboys")
        .update({
          posicao:
            outro.posicao
        })
        .eq(
          "id",
          atual.id
        );


    if (
      p3.error
    ) {

      throw p3.error;

    }


    await carregarDados();


  } catch (erro) {


    mostrarMensagem(
      "Não foi possível mudar a ordem: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   REMOVER DA FILA
   ===================================================== */

async function excluirDaFila(
  id
) {

  try {


    const busca =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          id
        )
        .maybeSingle();


    if (
      busca.error
    ) {

      throw busca.error;

    }


    const moto =
      busca.data;


    if (!moto) {

      return;

    }


    if (
      !confirm(
        "Remover " +
        moto.nome +
        " da fila?\n\n" +
        "O Grid será mantido."
      )
    ) {

      return;

    }


    const resposta =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "removido",

          posicao:
            null

        })
        .eq(
          "id",
          id
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    await reorganizarFila();


    await carregarDados();


  } catch (erro) {


    mostrarMensagem(
      "Não foi possível remover: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   RETORNO MANUAL
   ===================================================== */

async function retornarEntregaManual(
  id
) {

  try {


    const busca =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "id",
          id
        )
        .maybeSingle();


    if (
      busca.error
    ) {

      throw busca.error;

    }


    const moto =
      busca.data;


    if (
      !moto ||
      moto.status !==
      "em_entrega"
    ) {

      return;

    }


    if (
      !confirm(
        "Concluir a entrega de " +
        moto.nome +
        " e retornar para a fila?"
      )
    ) {

      return;

    }


    const maior =
      await supabaseClient
        .from("motoboys")
        .select(
          "posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();


    if (
      maior.error
    ) {

      throw maior.error;

    }


    const ultimaPosicao =
      maior.data?.posicao ||
      0;


    const novasEntregas =
      (
        moto.entregas_dia ||
        0
      ) + 1;


    const retorno =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "disponivel",

          posicao:
            ultimaPosicao + 1,

          entregas_dia:
            novasEntregas

        })
        .eq(
          "id",
          id
        );


    if (
      retorno.error
    ) {

      throw retorno.error;

    }


    await carregarDados();


  } catch (erro) {


    mostrarMensagem(
      "Não foi possível retornar: " +
      erro.message,
      "erro"
    );

  }

}

/* =====================================================
   CHAMAR PRÓXIMO
   ===================================================== */

async function chamarProximo() {

  esconderMensagem();


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        )
        .limit(1)
        .maybeSingle();


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const moto =
      resposta.data;


    if (!moto) {

      alert(
        "Não há motoboys disponíveis."
      );


      return;

    }


    const atualizacao =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "em_entrega",

          posicao:
            null

        })
        .eq(
          "id",
          moto.id
        );


    if (
      atualizacao.error
    ) {

      throw atualizacao.error;

    }


    await reorganizarFila();


    const chamado =
      document.getElementById(
        "chamado"
      );


    chamado.innerText =
      "🛵 " +
      moto.nome +
      " foi chamado para entrega!";


    chamado.style.display =
      "block";


    setTimeout(
      function() {

        chamado.style.display =
          "none";

      },
      5000
    );


    await carregarDados();


  } catch (erro) {


    mostrarMensagem(
      "Erro ao chamar o motoboy: " +
      erro.message,
      "erro"
    );

  }

}

/* =====================================================
   ENCERRAR DIA

   APAGA TODOS OS REGISTROS
   INDEPENDENTEMENTE DO STATUS.
   ===================================================== */

async function encerrarDia() {

  const confirmar =
    confirm(
      "ENCERRAR O DIA?\n\n" +
      "Todos os motoboys serão apagados.\n\n" +
      "Fila, Em entrega e Grid serão zerados."
    );


  if (!confirmar) {

    return;

  }


  esconderMensagem();


  try {


    /* BUSCA TODOS OS IDs */

    const busca =
      await supabaseClient
        .from("motoboys")
        .select("id");


    if (
      busca.error
    ) {

      throw busca.error;

    }


    const registros =
      busca.data || [];


    if (
      registros.length === 0
    ) {

      limparTelaEncerramento();


      alert(
        "🌙 Dia encerrado com sucesso!"
      );


      return;

    }


    const ids =
      registros.map(
        registro =>
          registro.id
      );


    /* APAGA TODOS */

    const apagar =
      await supabaseClient
        .from("motoboys")
        .delete()
        .in(
          "id",
          ids
        );


    if (
      apagar.error
    ) {

      throw apagar.error;

    }


    /* LIMPA A TELA IMEDIATAMENTE */

    limparTelaEncerramento();


    /* CONFERE O BANCO */

    const conferencia =
      await supabaseClient
        .from("motoboys")
        .select("id");


    if (
      conferencia.error
    ) {

      throw conferencia.error;

    }


    /*
      Se alguma linha continuar existindo,
      o painel informa o problema.
    */

    if (
      conferencia.data &&
      conferencia.data.length > 0
    ) {

      throw new Error(
        "Ainda existem registros na tabela após o encerramento."
      );

    }


    alert(
      "🌙 Dia encerrado com sucesso!\n\n" +
      "Fila: vazia\n" +
      "Em entrega: vazio\n" +
      "Grid: vazio"
    );


  } catch (erro) {


    console.error(
      "Erro ao encerrar dia:",
      erro
    );


    mostrarMensagem(
      "Não foi possível encerrar o dia: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   REALTIME
   ===================================================== */

supabaseClient

  .channel(
    "painel-motoboys-realtime"
  )

  .on(
    "postgres_changes",
    {

      event:
        "*",

      schema:
        "public",

      table:
        "motoboys"

    },

    function() {

      carregarDados();

    }

  )

  .subscribe();



/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
   ===================================================== */

setInterval(
  carregarDados,
  3000
);

document.addEventListener(

    if (
      document.visibilityState ===

    }

  }
);



window.addEventListener(

);

carregarDados();
