<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Painel - Fila de Motoboys</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

#relogio {
  font-size: 18px;
  font-weight: bold;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

.contador {
  background: #e5e7eb;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 13px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 5px;
  border-bottom: 1px solid #e5e7eb;
  gap: 10px;
}

.esquerda {
  display: flex;
  align-items: center;
}

.posicao {
  width: 50px;
  font-size: 22px;
  font-weight: bold;
}

.nome {
  font-size: 18px;
  font-weight: bold;
}

.info {
  margin-top: 4px;
  color: #6b7280;
  font-size: 13px;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  background: #dcfce7;
  color: #166534;
  white-space: nowrap;
}

.status.entrega {
  background: #fef3c7;
  color: #92400e;
}

.vazio {
  color: #6b7280;
  padding: 15px 0;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.chamar {
  width: 100%;
  background: #15803d;
  color: white;
}

.encerrar {
  background: #b91c1c;
  color: white;
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

#mensagem {
  display: none;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-weight: bold;
}

#mensagem.sucesso {
  display: block;
  background: #dcfce7;
  color: #166534;
}

#mensagem.erro {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

#chamado {
  display: none;
  background: #dcfce7;
  color: #166534;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.historico-item {
  padding: 12px 5px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
}

.historico-nome {
  font-weight: bold;
}

.historico-horario {
  color: #6b7280;
}


/* CONTROLES DA FILA */

.direita-fila {
  display: flex;
  align-items: center;
  gap: 10px;
}

.acoes-fila {
  display: flex;
  gap: 5px;
}

.acoes-fila button {
  padding: 8px 10px;
  font-size: 14px;
  border-radius: 8px;
}

.botao-subir,
.botao-descer {
  background: #374151;
  color: white;
}

.botao-excluir {
  background: #b91c1c;
  color: white;
}


@media (max-width: 750px) {

  .grid {
    grid-template-columns: 1fr;
  }

  header {
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }

}


@media (max-width: 600px) {

  .item-fila {
    align-items: flex-start;
    flex-direction: column;
  }

  .direita-fila {
    width: 100%;
    justify-content: space-between;
  }

}

</style>

</head>


<body>


<header>

  <h1>
    🛵 Painel da Pizzaria
  </h1>

  <div id="relogio">
    --:--
  </div>

</header>


<div class="container">

  <div id="mensagem"></div>

  <div id="chamado"></div>


  <!-- FILA E ENTREGAS -->

  <div class="grid">


    <!-- DISPONÍVEIS -->

    <div class="card">

      <h2>

        🟢 Disponíveis

        <span
          id="contadorFila"
          class="contador"
        >
          0
        </span>

      </h2>


      <div id="fila">
        Carregando...
      </div>

    </div>



    <!-- EM ENTREGA -->

    <div class="card">

      <h2>

        🛵 Em entrega

        <span
          id="contadorEntrega"
          class="contador"
        >
          0
        </span>

      </h2>


      <div id="entregas">
        Carregando...
      </div>

    </div>

  </div>



  <!-- CONTROLE -->

  <div class="card">

    <h2>
      🚀 Controle da loja
    </h2>


    <button
      class="chamar"
      onclick="chamarProximo()"
    >
      CHAMAR PRÓXIMO
    </button>


    <br><br>


    <button
      class="encerrar"
      onclick="encerrarDia()"
    >
      🌙 ENCERRAR DIA
    </button>

  </div>



  <!-- HISTÓRICO -->

  <div class="card">

    <h2>
      🕐 Primeiras chegadas de hoje
    </h2>


    <div id="historico">
      Carregando...
    </div>

  </div>

</div>



<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nmkkabthynytwevadthq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pvTjmMDG1aC7qDyYW3kEZA_WR9-a-E3";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      "mensagem"
    );


  elemento.innerText =
    texto;


  elemento.className =
    tipo;

}


function esconderMensagem() {

  const elemento =
    document.getElementById(
      "mensagem"
    );


  elemento.innerText =
    "";


  elemento.className =
    "";

}



/* =====================================================
   RELÓGIO
   ===================================================== */

function atualizarRelogio() {

  const agora =
    new Date();


  document
    .getElementById(
      "relogio"
    )
    .innerText =
    agora.toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

}


setInterval(
  atualizarRelogio,
  1000
);


atualizarRelogio();



/* =====================================================
   SEGURANÇA HTML
   ===================================================== */

function esc(texto) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    texto;


  return div.innerHTML;

}



/* =====================================================
   CARREGAR DADOS
   ===================================================== */

async function carregarDados() {

  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*");


    if (resposta.error) {

      throw resposta.error;

    }


    const todos =
      resposta.data || [];



    /* FILA */

    const fila =
      todos
        .filter(
          moto =>
            moto.status ===
            "disponivel"
        )
        .sort(
          (a,b) =>
            (a.posicao || 999999) -
            (b.posicao || 999999)
        );



    /* ENTREGAS */

    const entregas =
      todos.filter(
        moto =>
          moto.status ===
          "em_entrega"
      );


    mostrarFila(
      fila
    );


    mostrarEntregas(
      entregas
    );


    mostrarHistorico(
      todos
    );


  } catch (erro) {


    console.error(
      "Erro ao carregar:",
      erro
    );


    mostrarMensagem(
      "Erro ao carregar o sistema: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   MOSTRAR FILA
   ===================================================== */

function mostrarFila(
  fila
) {


  const elemento =
    document.getElementById(
      "fila"
    );


  elemento.innerHTML =
    "";


  document
    .getElementById(
      "contadorFila"
    )
    .innerText =
    fila.length;


  if (
    fila.length === 0
  ) {


    elemento.innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy disponível.' +
      '</div>';


    return;

  }



  fila.forEach(
    (moto, index) => {


      const horario =
        moto.primeira_chegada
          ?
          new Date(
            moto.primeira_chegada
          )
          .toLocaleTimeString(
            "pt-BR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
          :
          "--:--";


      const podeSubir =
        index > 0;


      const podeDescer =
        index <
        fila.length - 1;



      elemento.innerHTML += `

        <div class="item item-fila">


          <div class="esquerda">


            <div class="posicao">

              ${index + 1}º

            </div>


            <div>


              <div class="nome">

                ${esc(moto.nome)}

              </div>


              <div class="info">

                Primeira chegada:
                ${horario}

              </div>


            </div>


          </div>



          <div class="direita-fila">


            <div class="status">

              Disponível

            </div>



            <div class="acoes-fila">


              <button
                class="botao-subir"
                title="Subir uma posição"
                ${podeSubir ? "" : "disabled"}
                onclick="moverNaFila('${moto.id}', -1)"
              >

                ▲

              </button>


              <button
                class="botao-descer"
                title="Descer uma posição"
                ${podeDescer ? "" : "disabled"}
                onclick="moverNaFila('${moto.id}', 1)"
              >

                ▼

              </button>


              <button
                class="botao-excluir"
                title="Excluir da fila"
                onclick="excluirDaFila('${moto.id}')"
              >

                🗑️

              </button>


            </div>


          </div>


        </div>

      `;


    }
  );

}



/* =====================================================
   MOSTRAR ENTREGAS
   ===================================================== */

function mostrarEntregas(
  entregas
) {


  const elemento =
    document.getElementById(
      "entregas"
    );


  elemento.innerHTML =
    "";


  document
    .getElementById(
      "contadorEntrega"
    )
    .innerText =
    entregas.length;



  if (
    entregas.length === 0
  ) {


    elemento.innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy em entrega.' +
      '</div>';


    return;

  }



  entregas.forEach(
    moto => {


      const horario =
        moto.primeira_chegada
          ?
          new Date(
            moto.primeira_chegada
          )
          .toLocaleTimeString(
            "pt-BR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
          :
          "--:--";


      elemento.innerHTML += `

        <div class="item">


          <div>


            <div class="nome">

              🛵 ${esc(moto.nome)}

            </div>


            <div class="info">

              Primeira chegada:
              ${horario}

            </div>


          </div>


          <div class="status entrega">

            Em entrega

          </div>


        </div>

      `;


    }
  );

}



/* =====================================================
   HISTÓRICO
   ===================================================== */

function mostrarHistorico(
  motoboys
) {


  const elemento =
    document.getElementById(
      "historico"
    );


  elemento.innerHTML =
    "";



  const historico =
    [...motoboys]

      .filter(
        moto =>
          moto.primeira_chegada
      )

      .sort(
        (a,b) =>
          new Date(
            a.primeira_chegada
          ) -
          new Date(
            b.primeira_chegada
          )
      );



  if (
    historico.length === 0
  ) {


    elemento.innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy registrou chegada hoje.' +
      '</div>';


    return;

  }



  historico.forEach(
    (moto, index) => {


      const horario =
        new Date(
          moto.primeira_chegada
        )
        .toLocaleTimeString(
          "pt-BR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      elemento.innerHTML += `

        <div class="historico-item">


          <div class="historico-nome">

            ${index + 1}º —
            ${esc(moto.nome)}

          </div>


          <div class="historico-horario">

            🕐 ${horario}

          </div>


        </div>

      `;


    }
  );

}



/* =====================================================
   REORGANIZAR FILA
   ===================================================== */

async function reorganizarFila() {


  const resposta =
    await supabaseClient
      .from("motoboys")
      .select(
        "id,posicao"
      )
      .eq(
        "status",
        "disponivel"
      )
      .order(
        "posicao",
        {
          ascending: true
        }
      );


  if (
    resposta.error
  ) {

    throw resposta.error;

  }


  const fila =
    resposta.data || [];



  for (
    let i = 0;
    i < fila.length;
    i++
  ) {


    const novaPosicao =
      i + 1;


    if (
      fila[i].posicao !==
      novaPosicao
    ) {


      const atualizacao =
        await supabaseClient
          .from("motoboys")
          .update({

            posicao:
              novaPosicao

          })
          .eq(
            "id",
            fila[i].id
          );


      if (
        atualizacao.error
      ) {

        throw atualizacao.error;

      }

    }

  }

}



/* =====================================================
   SUBIR / DESCER MOTOBOY
   ===================================================== */

async function moverNaFila(
  id,
  direcao
) {


  esconderMensagem();


  try {


    /*
      Busca a fila atual.
    */

    const resposta =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,nome,posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    let fila =
      resposta.data || [];



    const indice =
      fila.findIndex(
        moto =>
          String(moto.id) ===
          String(id)
      );


    if (
      indice === -1
    ) {

      throw new Error(
        "Motoboy não encontrado."
      );

    }


    const novoIndice =
      indice + direcao;


    if (
      novoIndice < 0 ||
      novoIndice >= fila.length
    ) {

      return;

    }



    /*
      Primeiro reorganiza a fila.
    */

    await reorganizarFila();



    /*
      Busca novamente para pegar
      as posições atualizadas.
    */

    const novaResposta =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,nome,posicao"
        )
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        );


    if (
      novaResposta.error
    ) {

      throw novaResposta.error;

    }


    fila =
      novaResposta.data || [];


    const novoIndiceAtual =
      fila.findIndex(
        moto =>
          String(moto.id) ===
          String(id)
      );


    const destinoIndice =
      novoIndiceAtual +
      direcao;


    if (
      destinoIndice < 0 ||
      destinoIndice >= fila.length
    ) {

      return;

    }


    const atual =
      fila[
        novoIndiceAtual
      ];


    const outro =
      fila[
        destinoIndice
      ];



    /*
      Coloca temporariamente o atual
      numa posição negativa.
    */

    const passo1 =
      await supabaseClient
        .from("motoboys")
        .update({

          posicao:
            -999999

        })
        .eq(
          "id",
          atual.id
        );


    if (
      passo1.error
    ) {

      throw passo1.error;

    }



    /*
      O outro assume a posição
      do motoboy selecionado.
    */

    const passo2 =
      await supabaseClient
        .from("motoboys")
        .update({

          posicao:
            atual.posicao

        })
        .eq(
          "id",
          outro.id
        );


    if (
      passo2.error
    ) {

      throw passo2.error;

    }



    /*
      O selecionado assume a
      posição do outro.
    */

    const passo3 =
      await supabaseClient
        .from("motoboys")
        .update({

          posicao:
            outro.posicao

        })
        .eq(
          "id",
          atual.id
        );


    if (
      passo3.error
    ) {

      throw passo3.error;

    }



    mostrarMensagem(
      "✅ Ordem da fila alterada.",
      "sucesso"
    );


    await carregarDados();


  } catch (erro) {


    console.error(
      "Erro ao mudar ordem:",
      erro
    );


    mostrarMensagem(
      "Não foi possível mudar a ordem: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   EXCLUIR DA FILA
   ===================================================== */

async function excluirDaFila(
  id
) {


  esconderMensagem();


  try {


    /*
      Busca o motoboy para mostrar
      o nome na confirmação.
    */

    const busca =
      await supabaseClient
        .from("motoboys")
        .select(
          "id,nome,status"
        )
        .eq(
          "id",
          id
        )
        .maybeSingle();


    if (
      busca.error
    ) {

      throw busca.error;

    }


    const moto =
      busca.data;


    if (!moto) {

      throw new Error(
        "Motoboy não encontrado."
      );

    }


    if (
      moto.status !==
      "disponivel"
    ) {

      alert(
        "Esse motoboy não está mais na fila de disponíveis."
      );

      await carregarDados();

      return;

    }



    const confirmar =
      confirm(
        "Excluir " +
        moto.nome +
        " da fila?\n\n" +
        "Ele será removido da fila de disponíveis."
      );


    if (
      !confirmar
    ) {

      return;

    }



    const resposta =
      await supabaseClient
        .from("motoboys")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "status",
          "disponivel"
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }



    /*
      Corrige a ordem restante.
    */

    await reorganizarFila();



    mostrarMensagem(
      "🗑️ " +
      moto.nome +
      " foi excluído da fila.",
      "sucesso"
    );


    await carregarDados();


  } catch (erro) {


    console.error(
      "Erro ao excluir:",
      erro
    );


    mostrarMensagem(
      "Não foi possível excluir da fila: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   CHAMAR PRÓXIMO
   ===================================================== */

async function chamarProximo() {


  esconderMensagem();


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .select("*")
        .eq(
          "status",
          "disponivel"
        )
        .order(
          "posicao",
          {
            ascending: true
          }
        )
        .limit(1)
        .maybeSingle();


    if (
      resposta.error
    ) {

      throw resposta.error;

    }


    const moto =
      resposta.data;



    if (!moto) {


      alert(
        "Não há motoboys disponíveis."
      );


      return;

    }



    const atualizacao =
      await supabaseClient
        .from("motoboys")
        .update({

          status:
            "em_entrega",

          posicao:
            null

        })
        .eq(
          "id",
          moto.id
        );


    if (
      atualizacao.error
    ) {

      throw atualizacao.error;

    }



    /*
      Reorganiza a fila restante.
    */

    await reorganizarFila();



    const chamado =
      document.getElementById(
        "chamado"
      );


    chamado.innerText =
      "🛵 " +
      moto.nome +
      " foi chamado para entrega!";


    chamado.style.display =
      "block";


    setTimeout(
      function() {

        chamado.style.display =
          "none";

      },
      5000
    );


    await carregarDados();


  } catch (erro) {


    console.error(
      "Erro ao chamar:",
      erro
    );


    mostrarMensagem(
      "Erro ao chamar o motoboy: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   ENCERRAR DIA
   ===================================================== */

async function encerrarDia() {


  const confirmar =
    confirm(
      "ENCERRAR O DIA?\n\n" +
      "Todos os motoboys da fila e " +
      "em entrega serão removidos.\n\n" +
      "O histórico de primeiras chegadas " +
      "também ficará vazio."
    );


  if (
    !confirmar
  ) {

    return;

  }


  try {


    const resposta =
      await supabaseClient
        .from("motoboys")
        .delete()
        .in(
          "status",
          [
            "disponivel",
            "em_entrega"
          ]
        );


    if (
      resposta.error
    ) {

      throw resposta.error;

    }



    document
      .getElementById(
        "fila"
      )
      .innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy disponível.' +
      '</div>';



    document
      .getElementById(
        "entregas"
      )
      .innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy em entrega.' +
      '</div>';



    document
      .getElementById(
        "historico"
      )
      .innerHTML =
      '<div class="vazio">' +
      'Nenhum motoboy registrou chegada hoje.' +
      '</div>';



    document
      .getElementById(
        "contadorFila"
      )
      .innerText =
      "0";



    document
      .getElementById(
        "contadorEntrega"
      )
      .innerText =
      "0";



    await carregarDados();



    alert(
      "🌙 Dia encerrado com sucesso!\n\n" +
      "Fila: vazia\n" +
      "Em entrega: vazio\n" +
      "Histórico: vazio"
    );


  } catch (erro) {


    console.error(
      "Erro ao encerrar:",
      erro
    );


    mostrarMensagem(
      "Não foi possível encerrar o dia: " +
      erro.message,
      "erro"
    );

  }

}



/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
   ===================================================== */

supabaseClient
  .channel(
    "painel-motoboys"
  )
  .on(
    "postgres_changes",
    {

      event:
        "*",

      schema:
        "public",

      table:
        "motoboys"

    },

    function() {

      carregarDados();

    }

  )
  .subscribe();



/* =====================================================
   INICIAR
   ===================================================== */

carregarDados();


</script>
